<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Card Order Prototype</title>
<style>
:root{
  --font:"SF Pro Display",-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --stage:#1c1d20;
  --ink:rgba(21,20,20,.9);
  --ink2:rgba(21,20,20,.5);
  --red:#ea3340;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}
input{font:inherit}
img{display:block}

.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#device{position:relative;width:375px;height:812px;flex:none;overflow:hidden;border-radius:46px;background:#f5f5f5;
  box-shadow:0 0 0 11px #0b0b0c,0 0 0 12px #3b3c40,0 40px 90px rgba(0,0,0,.55);transform-origin:center center;isolation:isolate}
body.is-bare #device{border-radius:0;box-shadow:none}

#pages{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;background:#f5f5f5;will-change:transform}
.layer.anim-in{animation:pushIn .38s cubic-bezier(.2,.8,.2,1) both}
.layer.anim-out{animation:pushOut .38s cubic-bezier(.2,.8,.2,1) both}
.layer.anim-back-in{animation:backIn .38s cubic-bezier(.2,.8,.2,1) both}
.layer.anim-back-out{animation:backOut .38s cubic-bezier(.2,.8,.2,1) both}
.layer.anim-fade{animation:fadeIn .3s ease both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{from{transform:none}to{transform:translateX(-28%);filter:brightness(.92)}}
@keyframes backIn{from{transform:translateX(-28%);filter:brightness(.92)}to{transform:none}}
@keyframes backOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.scr{position:absolute;inset:0;width:375px;height:812px;overflow:hidden;font-family:var(--font);color:var(--ink)}
.scr__scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scr__scroll::-webkit-scrollbar,.sheet__scroll::-webkit-scrollbar{display:none}
.sheet__scroll{scrollbar-width:none}

#sheets{position:absolute;inset:0;pointer-events:none;z-index:20}
.sheet-wrap{position:absolute;inset:0;pointer-events:auto}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fadeIn .25s ease both}
.sheet-holder{position:absolute;left:0;right:0;bottom:0;animation:sheetUp .4s cubic-bezier(.2,.8,.2,1) both}
.sheet-wrap.is-closing .sheet-backdrop{animation:fadeOut .4s ease both}
.sheet-wrap.is-closing .sheet-holder{animation:sheetDown .4s cubic-bezier(.4,0,.6,1) both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.sheet{position:relative;width:375px;font-family:var(--font);color:var(--ink)}

#statusbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:60;pointer-events:none;color:#000;transition:color .2s}
#statusbar.is-light, #statusbar.is-light #clock{color:#fff}
#clock{position:absolute;left:0;top:0;width:100px;height:44px;display:flex;align-items:center;justify-content:center;padding:0 6px 0 16px;
  font:590 17px/22px var(--font);color:rgba(21,20,20,.9);pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none;padding-top:2px}
#clock .press-ring{position:absolute;inset:6px 18px;border-radius:14px;background:rgba(120,120,128,.18);opacity:0;transform:scale(.8);transition:opacity .15s,transform .6s}
#clock.is-pressing .press-ring{opacity:1;transform:scale(1)}
#sb-right{position:absolute;right:0;top:15.5px;width:100px;height:13px}
#statusbar.is-light #sb-right{filter:invert(1) brightness(2)}
#homeind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:#000;z-index:60;transform:translateX(-50%);pointer-events:none;transition:background .2s}
#homeind.is-light{background:#fff}

#toast{position:absolute;left:16px;right:16px;bottom:110px;z-index:70;background:rgba(30,30,32,.92);color:#fff;border-radius:12px;padding:12px 14px;
  font:400 14px/18px var(--font);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.is-on{opacity:1;transform:none}

[hidden]{display:none!important}
#gate{position:absolute;inset:0;z-index:55;background:#f5f5f7;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:132px 0 70px;font-family:var(--font);color:rgba(21,20,20,.9);user-select:none;-webkit-user-select:none;transition:opacity .3s}
#gate.is-ok{opacity:0}
.gate-head{display:flex;flex-direction:column;align-items:center}
.gate-lock{width:28px;height:28px;margin-bottom:16px;opacity:.9}
.gate-title{font:600 22px/28px var(--font);letter-spacing:-.2px}
.gate-sub{margin-top:4px;font:400 14px/20px var(--font);color:rgba(21,20,20,.5)}
.gate-dots{display:flex;gap:18px;margin-top:28px}
.gate-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(21,20,20,.9);transition:background .1s,border-color .1s}
.gate-dot.is-on{background:rgba(21,20,20,.9)}
#gate.is-err .gate-dots{animation:gateShake .38s ease}
#gate.is-err .gate-dot{border-color:#d50819}
#gate.is-err .gate-dot.is-on{background:#d50819}
#gate.is-ok .gate-dot{border-color:#28b469;background:#28b469}
.gate-msg{height:20px;margin-top:14px;font:400 14px/20px var(--font);color:#d50819}
@keyframes gateShake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.gate-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px}
.gate-pad button{width:76px;height:76px;border-radius:50%;background:#fff;font:400 30px/1 var(--font);color:rgba(21,20,20,.9);text-align:center;
  box-shadow:0 1px 2px rgba(0,0,0,.04);transition:background .1s,transform .1s}
.gate-pad button:active{background:#e9e7e7;transform:scale(.95)}
.gate-pad .gate-del{background:transparent;box-shadow:none;font-size:24px;color:rgba(21,20,20,.6)}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:rgba(255,255,255,.45);font:400 12px/16px var(--font);white-space:nowrap}
body.is-bare .hint{display:none}
</style>
<style id="settings-css"></style>
</head>
<body>
<div class="stage">
  <div id="device">
    <div id="pages"></div>
    <div id="sheets"></div>
    <div id="statusbar">
      <div id="clock"><span class="press-ring"></span><span style="position:relative">12:12</span></div>
      <img id="sb-right" src="assets/shell/statusbar-levels.svg" width="100" height="13" alt="">
    </div>
    <div id="homeind"></div>
    <div id="toast"></div>
    <div id="gate" hidden>
      <div class="gate-head">
        <img class="gate-lock" src="assets/order2/ic-lock.svg" alt="" width="28" height="28">
        <div class="gate-title">Enter password</div>
        <div class="gate-sub">Card order prototype</div>
        <div class="gate-dots"><i class="gate-dot"></i><i class="gate-dot"></i><i class="gate-dot"></i><i class="gate-dot"></i></div>
        <div class="gate-msg" aria-live="polite"></div>
      </div>
      <div class="gate-pad">
        <button type="button" data-gate-key="1">1</button><button type="button" data-gate-key="2">2</button><button type="button" data-gate-key="3">3</button>
        <button type="button" data-gate-key="4">4</button><button type="button" data-gate-key="5">5</button><button type="button" data-gate-key="6">6</button>
        <button type="button" data-gate-key="7">7</button><button type="button" data-gate-key="8">8</button><button type="button" data-gate-key="9">9</button>
        <span></span><button type="button" data-gate-key="0">0</button><button type="button" class="gate-del" data-gate-key="del" aria-label="Delete">⌫</button>
      </div>
    </div>
  </div>
</div>
<div class="hint">Удерживайте часы, чтобы открыть настройки прототипа</div>

<!-- screens -->
<!-- ===== part: home ===== -->
<style>
/* ===================== shared card-row / cards-block fragments (global .cb- prefix) ===================== */
.cb-block{display:flex;flex-direction:column;gap:4px;width:100%;font-family:var(--font);color:rgba(21,20,20,.9)}
.cb-head{padding:0 16px;font:500 16px/24px var(--font);color:rgba(21,20,20,.5)}
.cb-list{display:flex;flex-direction:column;gap:4px}
.cb-list:empty{display:none}
.cb-row{display:flex;align-items:flex-start;gap:12px;width:100%;padding:0 16px;font-family:var(--font);color:rgba(21,20,20,.9);text-align:left}
.cb-thumb-box{flex:none;height:64px;display:flex;align-items:center}
.cb-thumb{position:relative;width:56px;height:40px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.15)}
.cb-thumb .cb-skin{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.cb-thumb .cb-shadow{position:absolute;left:0;top:0;width:56px;height:40px}
.cb-thumb .cb-pay{position:absolute;left:2px;top:0;width:16px;height:16px}
.cb-thumb .cb-num{position:absolute;right:5px;bottom:1px;display:flex;align-items:center;gap:2px;color:#fff;white-space:nowrap;font:400 12px/16px var(--font)}
.cb-thumb .cb-num b{font-weight:600}
.cb-info{flex:1 1 0;min-width:0;min-height:64px;display:flex;flex-direction:column;justify-content:center;padding:8px 0;overflow:hidden}
.cb-amount{display:flex;align-items:baseline;padding:2px 0;white-space:nowrap;font:500 16px/20px var(--font);color:rgba(21,20,20,.9)}
.cb-amount .cb-dec,.cb-amount .cb-cur{font-size:14px;line-height:20px}
.cb-amount .cb-cur{padding-left:2px}
.cb-name{height:18px;padding-bottom:2px;font:400 12px/16px var(--font);color:rgba(21,20,20,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===================== shared chrome for home + home-alt ===================== */
:is(.scr--home,.scr--home-alt){background:#f7f6f6}
:is(.scr--home,.scr--home-alt) button{cursor:pointer}
:is(.scr--home,.scr--home-alt) img{max-width:none}

/* navbar (fixed, glass) */
:is(.scr--home,.scr--home-alt) .hm-nav{position:absolute;left:0;top:0;width:375px;height:100px;z-index:5}
:is(.scr--home,.scr--home-alt) .hm-nav__bg{position:absolute;left:0;top:0;width:375px;height:136px;pointer-events:none;
  background:rgba(247,246,246,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 56px,rgba(0,0,0,0.992) 65.4px,rgba(0,0,0,0.968) 73.1px,rgba(0,0,0,0.930) 79.3px,rgba(0,0,0,0.879) 84.3px,rgba(0,0,0,0.819) 88.3px,rgba(0,0,0,0.749) 91.6px,rgba(0,0,0,0.672) 94.6px,rgba(0,0,0,0.589) 97.4px,rgba(0,0,0,0.503) 100.4px,rgba(0,0,0,0.415) 103.7px,rgba(0,0,0,0.326) 107.7px,rgba(0,0,0,0.238) 112.7px,rgba(0,0,0,0.154) 118.9px,rgba(0,0,0,0.074) 126.6px,rgba(0,0,0,0) 136px);
  mask-image:linear-gradient(to bottom,#000 0,#000 56px,rgba(0,0,0,0.992) 65.4px,rgba(0,0,0,0.968) 73.1px,rgba(0,0,0,0.930) 79.3px,rgba(0,0,0,0.879) 84.3px,rgba(0,0,0,0.819) 88.3px,rgba(0,0,0,0.749) 91.6px,rgba(0,0,0,0.672) 94.6px,rgba(0,0,0,0.589) 97.4px,rgba(0,0,0,0.503) 100.4px,rgba(0,0,0,0.415) 103.7px,rgba(0,0,0,0.326) 107.7px,rgba(0,0,0,0.238) 112.7px,rgba(0,0,0,0.154) 118.9px,rgba(0,0,0,0.074) 126.6px,rgba(0,0,0,0) 136px)}
:is(.scr--home,.scr--home-alt) .hm-nav__bar{position:absolute;left:0;top:44px;width:375px;height:56px;display:flex;align-items:flex-start;gap:12px;padding:8px 16px}
:is(.scr--home,.scr--home-alt) .hm-nav__left{display:flex;align-items:center;gap:12px}
:is(.scr--home,.scr--home-alt) .hm-nav__right{flex:1 1 0;display:flex;align-items:center;justify-content:flex-end;gap:12px}
:is(.scr--home,.scr--home-alt) .hm-nav__grp{display:flex;align-items:center;gap:12px}
:is(.scr--home,.scr--home-alt) .hm-g{position:relative;flex:none;display:flex;align-items:center;justify-content:center;height:40px;min-width:40px;border-radius:256px}
:is(.scr--home,.scr--home-alt) .hm-g__glass{position:absolute;left:-40px;top:-48px;width:120px;height:120px;transform:scaleY(-1);pointer-events:none}
:is(.scr--home,.scr--home-alt) .hm-g__glass--wide{width:calc(100% + 80px)}
:is(.scr--home,.scr--home-alt) .hm-g__ic{position:relative;width:24px;height:24px}
:is(.scr--home,.scr--home-alt) .hm-g--pill{padding:8px;gap:2px}
:is(.scr--home,.scr--home-alt) .hm-g--pill span{position:relative;padding:0 4px;font:500 16px/20px var(--font);color:rgba(21,20,20,.9);white-space:nowrap}
:is(.scr--home,.scr--home-alt) .hm-avatar{position:relative;width:40px;height:40px;border-radius:256px;overflow:hidden;background:#fff;border:1px solid rgba(21,20,20,.1)}
:is(.scr--home,.scr--home-alt) .hm-avatar img{position:absolute}
:is(.scr--home,.scr--home-alt) .hm-avatar .a1{inset:0;width:100%;height:100%;object-fit:cover}
:is(.scr--home,.scr--home-alt) .hm-avatar .a2{left:-10.94%;top:-58.87%;width:121.87%;height:264.22%}

/* tabbar (fixed bottom) */
:is(.scr--home,.scr--home-alt) .hm-tab{position:absolute;left:0;bottom:0;width:375px;height:82px;z-index:5;padding:0 20px 20px}
:is(.scr--home,.scr--home-alt) .hm-tab__bg{position:absolute;inset:0;background:#f5f5f7;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0.074) 4.8px,rgba(0,0,0,0.154) 8.8px,rgba(0,0,0,0.238) 11.9px,rgba(0,0,0,0.326) 14.5px,rgba(0,0,0,0.415) 16.6px,rgba(0,0,0,0.503) 18.3px,rgba(0,0,0,0.589) 19.8px,rgba(0,0,0,0.672) 21.2px,rgba(0,0,0,0.749) 22.7px,rgba(0,0,0,0.819) 24.4px,rgba(0,0,0,0.879) 26.5px,rgba(0,0,0,0.930) 29.1px,rgba(0,0,0,0.968) 32.2px,rgba(0,0,0,0.992) 36.2px,#000 41px);
  mask-image:linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0.074) 4.8px,rgba(0,0,0,0.154) 8.8px,rgba(0,0,0,0.238) 11.9px,rgba(0,0,0,0.326) 14.5px,rgba(0,0,0,0.415) 16.6px,rgba(0,0,0,0.503) 18.3px,rgba(0,0,0,0.589) 19.8px,rgba(0,0,0,0.672) 21.2px,rgba(0,0,0,0.749) 22.7px,rgba(0,0,0,0.819) 24.4px,rgba(0,0,0,0.879) 26.5px,rgba(0,0,0,0.930) 29.1px,rgba(0,0,0,0.968) 32.2px,rgba(0,0,0,0.992) 36.2px,#000 41px)}
:is(.scr--home,.scr--home-alt) .hm-tab__pill{position:relative;display:flex;align-items:center;height:62px;padding:4px;border-radius:256px;
  background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 8px 40px rgba(0,0,0,.08)}
:is(.scr--home,.scr--home-alt) .hm-tab__t{flex:1 1 0;min-width:0;height:100%;margin-right:-8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:2px;border-radius:256px;position:relative}
:is(.scr--home,.scr--home-alt) .hm-tab__t:last-child{margin-right:0}
:is(.scr--home,.scr--home-alt) .hm-tab__t img{width:24px;height:24px}
:is(.scr--home,.scr--home-alt) .hm-tab__t span{width:100%;text-align:center;font:600 10px/12px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.5)}
/* Tabbar tokens as in the Main Page mockup (Text_and_Icon_Brand #f74454, Base_Secondary #00000080, Surface_Base_Secondary #0000000d);
   home-alt overrides them below with the values of its own mockup */
:is(.scr--home,.scr--home-alt) .hm-tab__t.is-on{background:rgba(0,0,0,.05)}
:is(.scr--home,.scr--home-alt) .hm-tab__t.is-on span{color:#f74454}

/* stories */

:is(.scr--home,.scr--home-alt) .hm-stories::-webkit-scrollbar{display:none}
:is(.scr--home,.scr--home-alt) .hm-story{position:relative;flex:none;width:96px;margin-right:-10px;padding:0 4px;display:flex;flex-direction:column;align-items:center;gap:8px}
:is(.scr--home,.scr--home-alt) .hm-story:last-child{margin-right:0}
:is(.scr--home,.scr--home-alt) .hm-story__c{position:relative;width:64px;height:64px;border-radius:48px;overflow:hidden;background:#b51d29}
:is(.scr--home,.scr--home-alt) .hm-story__c img{position:absolute}
:is(.scr--home,.scr--home-alt) .hm-story__ring{position:absolute;left:14px;top:-2px;width:68px;height:68px;border-radius:51px;border:1.063px solid #f79aa8;pointer-events:none}
:is(.scr--home,.scr--home-alt) .hm-story__t{width:76px;min-height:28px;display:flex;flex-direction:column;justify-content:flex-start;text-align:center;font:500 12px/14px var(--font);color:rgba(21,20,20,.9);overflow-wrap:break-word;text-wrap:balance}
:is(.scr--home,.scr--home-alt) .hm-story__pin{position:absolute;left:66px;top:46px;width:20px;height:20px}

/* products & services carousel */
:is(.scr--home,.scr--home-alt) .hm-prods{display:flex;flex-direction:column;gap:4px}
:is(.scr--home,.scr--home-alt) .hm-h3{padding:0 16px 4px}
:is(.scr--home,.scr--home-alt) .hm-h3 div{min-height:40px;display:flex;align-items:center;font:700 20px/24px var(--font);letter-spacing:-.1px;color:rgba(21,20,20,.9)}
:is(.scr--home,.scr--home-alt) .hm-prods__strip{display:flex;gap:8px;padding:8px 12px 4px;overflow-x:auto;scrollbar-width:none}
:is(.scr--home,.scr--home-alt) .hm-prods__strip::-webkit-scrollbar{display:none}
:is(.scr--home,.scr--home-alt) .hm-pi{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:24px}
:is(.scr--home,.scr--home-alt) .hm-pi__c{position:relative;width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none}
:is(.scr--home,.scr--home-alt) .hm-pi__c img{position:absolute}
:is(.scr--home,.scr--home-alt) .hm-pi__c .bgc{left:0;top:0;width:56px;height:56px}
:is(.scr--home,.scr--home-alt) .hm-pi__c--plus{background:#fff}
:is(.scr--home,.scr--home-alt) .hm-pi__c--plus img{left:20px;top:20px;width:16px;height:16px}
:is(.scr--home,.scr--home-alt) .hm-pi__t{width:72px;height:32px;text-align:center;font:500 14px/16px var(--font);color:rgba(21,20,20,.9)}

/* feed */
:is(.scr--home,.scr--home-alt) .hm-feed{display:flex;flex-direction:column;gap:16px}
:is(.scr--home,.scr--home-alt) .hm-feed__h{display:flex;gap:4px;padding:16px 16px 0;font:700 20px/24px var(--font);letter-spacing:-.1px;color:rgba(21,20,20,.9);white-space:pre}
:is(.scr--home,.scr--home-alt) .hm-feed__slot{display:flex;flex-direction:column;gap:12px}
:is(.scr--home,.scr--home-alt) .hm-row{display:flex;align-items:flex-start;gap:12px;padding:0 16px}
:is(.scr--home,.scr--home-alt) .hm-snip{flex:1 1 0;min-width:130px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
:is(.scr--home,.scr--home-alt) .hm-snip__ph{position:relative;width:100%;aspect-ratio:1/1;background:#fff;border:.5px solid rgba(21,20,20,.1);border-radius:16px;display:flex;flex-direction:column;justify-content:flex-end}
:is(.scr--home,.scr--home-alt) .hm-snip__img{position:absolute;inset:3.5px 3px 3px 3.5px;border-radius:12px;overflow:hidden}
:is(.scr--home,.scr--home-alt) .hm-snip__img img{width:100%;height:100%;object-fit:contain;display:block}

<style>
/* ================= order1: shared sheet title (add-card / product / currency) ================= */
:is(.sheet--add-card,.sheet--product,.sheet--currency){background:#f1f1f4;border-radius:16px 16px 0 0;overflow:hidden}
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st{position:relative;flex:none;padding-bottom:16px;background:#f1f1f4;border-radius:16px 16px 0 0}
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st__grab{display:block;width:375px;height:16px}
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st__title{margin:8px 0 0;padding:0 64px 0 16px;font:700 28px/32px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9)}
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st--nox .o1-st__title{padding-right:16px}
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st__x{position:absolute;right:20px;top:28px;display:flex;padding:4px;border-radius:21.6px;background:#fff;cursor:pointer}
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st__x img{width:20px;height:20px}

/* ================= add-card ================= */
.sheet--add-card{padding-bottom:34px}
.sheet--add-card .ac-main{display:flex;flex-direction:column;align-items:center;padding:0 16px 16px}
.sheet--add-card .ac-hero{display:flex;flex-direction:column;align-items:center;gap:12px;width:293px;cursor:pointer}
.sheet--add-card .ac-hero__img{position:relative;display:block;width:293px;height:120px}
.sheet--add-card .ac-hero__card{position:absolute;left:calc(50% - .5px);top:17px;transform:translateX(-50%);display:grid;width:146px;height:91.86px;border-radius:12.167px;overflow:hidden}
.sheet--add-card .ac-hero__card img,.sheet--add-card .ac-hero__card::after{grid-area:1/1}
.sheet--add-card .ac-hero__card img{width:146px;height:91.86px;object-fit:cover}
.sheet--add-card .ac-hero__card::after{content:"";border:.608px solid rgba(255,255,255,.15);border-radius:12.167px}
.sheet--add-card .ac-hero__title{display:block;width:293px;padding-top:3px;font:700 28px/32px var(--font);letter-spacing:-.1px;text-align:center;color:rgba(0,0,0,.9)}
.sheet--add-card .ac-main__sub{width:293px;margin:4px 0 0;font:400 14px/20px var(--font);letter-spacing:-.1px;text-align:center;color:rgba(0,0,0,.9)}
.sheet--add-card .ac-main__btn{display:flex;align-items:center;justify-content:center;height:40px;margin-top:16px;padding:4px 16px;border-radius:10px;background:#ec3342;font:500 16px/20px var(--font);letter-spacing:-.1px;color:#fff;cursor:pointer}

.sheet--add-card .ac-tabs{display:flex;gap:16px;margin-top:8px;padding:0 16px}
.sheet--add-card .ac-tab{height:32px;padding:6px 14px;border-radius:24px;font:500 14px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.5);white-space:nowrap;cursor:pointer}

/* ================= BirDS interaction states =================
   Press feedback (BirDS "Animation and interaction"): press-token fill, content 0.95, 100 ms,
   outer size / touch area unchanged. These screens use the legacy library (Button
   cd13c477…/d7d8ac0f…, Box Input, Passcode input), so its tokens are kept: brand #ec3342,
   brand-pressed #a81d29, disabled = 50 % opacity. */
/* Button Primary (40 / L-56): Pressed + Disabled */
:is(.sheet--add-card .ac-main__btn,.sheet--product .pi-cta,.sheet--currency .cu-btn,:is(.scr--phone,.scr--pin) .o1-btn,.scr--info .in-btn):active{background:#a81d29;transition:background-color .1s ease-out}
:is(.sheet--add-card .ac-main__btn,.sheet--product .pi-cta,.sheet--currency .cu-btn,:is(.scr--phone,.scr--pin) .o1-btn,.scr--info .in-btn):disabled{opacity:.5;pointer-events:none;cursor:default}
.sheet--product .pi-cta>span{display:inline-block;transition:transform .1s ease-out}
.sheet--product .pi-cta:active>span{transform:scale(.95)}
/* Sheet Title close (Button Icon / Circular, Secondary on surface): pressed fill + icon 0.95 */
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st__x img,.scr--info .in-back img{transition:transform .1s ease-out}
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st__x:active,.scr--info .in-back:active{background:#e9e7e7;transition:background-color .1s ease-out}
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st__x:active img,.scr--info .in-back:active img{transform:scale(.95)}
/* Chips (tabs "For daily / travel / Premium"): pressed fill 150 ms in, selection instant */
.sheet--add-card .ac-tab:active{background:#e9e7e7;transition:background-color .15s ease-out}
/* Chips (Card) — product chips: pressed fill + content 0.95 */

<style>
/* ===== order2: shared fragments (o2-) ===== */
.o2-iconbtn{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer}
.o2-iconbtn img{width:24px;height:24px}
.o2-btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:10px;background:#ec3342;color:#fff;
  font:500 16px/20px var(--font);letter-spacing:-.1px;text-align:center;cursor:pointer;padding:4px 16px}
.o2-btn--ghost{background:none;color:#ec3342;line-height:24px;letter-spacing:0}
.o2-logos{display:flex;align-items:center;justify-content:center;gap:12px;height:24px;width:375px}
.o2-logos .o2-logos__bir{width:39.8px;height:19.866px;margin-bottom:.665px}
.o2-logos .o2-logos__sep{width:2px;height:18px}
.o2-logos .o2-logos__sima{width:39.843px;height:12px;object-fit:cover}
/* BirDS press feedback (Button (Regular) / Button (Icon), "Animation and interaction"): on press the background
   takes the press token and the content scales to .95 in 100 ms while the background layer keeps the full bounds.
   ::before is that background layer; it counter-scales (1/.95) so only the content shrinks. */
.o2-btn,button.o2-iconbtn{isolation:isolate;transition:transform .1s ease-out}
.o2-btn{position:relative}
.o2-btn::before,button.o2-iconbtn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  transition:transform .1s ease-out,background-color .1s ease-out}
button.o2-iconbtn::before{border-radius:256px}
.o2-btn:active,button.o2-iconbtn:active{transform:scale(.95)}
.o2-btn:active::before{background:#d12432;transform:scale(1.0526)}           /* UI_Element_Brand_pressed */
.o2-btn--ghost:active::before,button.o2-iconbtn:active::before{background:#e9e7e7;transform:scale(1.0526)} /* UI_Element_Base_pressed */
/* Loader (4 stages, Smart animate 300 ms ease-out each, clockwise ~100° per stage) */
.o2-spin{position:relative;width:24px;height:24px;animation:o2spin 1.2s ease-out infinite}
.o2-spin img{position:absolute}
.o2-spin .o2-spin__ring{inset:0;width:24px;height:24px}
.o2-spin .o2-spin__head{top:0;left:50%;width:3.372px;height:3.372px;transform:translateX(-50%) scaleX(-1)}
@keyframes o2spin{0%{transform:rotate(0)}25%{transform:rotate(100deg)}50%{transform:rotate(195deg)}75%{transform:rotate(300deg)}100%{transform:rotate(360deg)}}

/* ===== kyc-intro ===== */
.scr--kyc-intro{background:#f1f1f4}
.scr--kyc-intro .ki-back{left:16px;top:48px;width:40px;height:40px}
.scr--kyc-intro .o2-logos{position:absolute;left:0;top:56px}
.scr--kyc-intro .ki-zero{position:absolute;left:0;top:calc(50% - 48px);transform:translateY(-50%);width:375px;padding:0 16px;
  display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.scr--kyc-intro .ki-icon{position:relative;width:56px;height:56px;border-radius:16px;background:#fff;overflow:hidden}
.scr--kyc-intro .ki-icon img{position:absolute;left:10px;top:10px;width:36px;height:36px}
.scr--kyc-intro .ki-texts{display:flex;flex-direction:column;gap:8px;width:100%;letter-spacing:-.1px}
.scr--kyc-intro .ki-title{margin:0;font:700 28px/32px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9)}
.scr--kyc-intro .ki-text{margin:0;font:400 16px/24px var(--font);letter-spacing:-.1px;color:#25282b}
.scr--kyc-intro .ki-bottom{position:absolute;left:0;bottom:0;width:375px;padding-top:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.scr--kyc-intro .ki-bottom::before{content:"";position:absolute;left:0;right:0;bottom:0;top:-25%;pointer-events:none;
  background:linear-gradient(to top,#fff 50%,rgba(255,255,255,.99) 53.3%,rgba(255,255,255,.96) 56.6%,rgba(255,255,255,.92) 59.9%,rgba(255,255,255,.85) 63.2%,rgba(255,255,255,.77) 66.5%,rgba(255,255,255,.67) 69.8%,rgba(255,255,255,.56) 73%,rgba(255,255,255,.44) 76.3%,rgba(255,255,255,.33) 79.6%,rgba(255,255,255,.23) 82.9%,rgba(255,255,255,.15) 86.2%,rgba(255,255,255,.08) 89.5%,rgba(255,255,255,.04) 92.8%,rgba(255,255,255,0) 99.4%)}
.scr--kyc-intro .ki-actions{position:relative;width:100%;padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.scr--kyc-intro .ki-consent{display:flex;align-items:center;gap:12px;width:375px;padding:0 16px;cursor:pointer;text-align:left}
/* Checkbox (BirDS): Pressed state + 150 ms transitions; selecting grows the brand "Color" circle (0 → 34 px) inside the box */
.scr--kyc-intro .ki-check{position:relative;flex:none;width:24px;height:24px;border-radius:4px;background:#eeeff1;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:background-color .15s}
.scr--kyc-intro .ki-check::before{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#ec3342;
  transform:scale(0);transition:transform .15s ease-out,background-color .15s}
.scr--kyc-intro .ki-check img{position:relative;width:16px;height:16px;opacity:0;filter:brightness(0) invert(1);transition:opacity .15s}
.scr--kyc-intro .ki-consent:active .ki-check{background:#bbbfc3}

<style>
/* ===== delivery group: shared fragments (dl-*) ===== */
.dl-abs{position:absolute}
.dl-map{position:absolute;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.dl-img{position:absolute;max-width:none;pointer-events:none}
.dl-btn{cursor:pointer}

/* new header (circle back, 2-line title, segmented chips) */
.dl-hd{position:absolute;left:0;top:0;width:375px;z-index:5;background:#f1f1f4;border-bottom:.5px solid rgba(0,0,0,.1);padding-bottom:12px;display:flex;flex-direction:column;gap:12px}
.dl-hd__nav{padding-top:44px;display:flex;flex-direction:column;gap:4px}
.dl-hd__bar{height:56px;padding:0 16px;display:flex;align-items:center}
.dl-back{width:40px;height:40px;border-radius:256px;background:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dl-back img{width:24px;height:24px}
.dl-title{padding:0 16px;font:700 28px/32px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9);margin:0;text-wrap:balance}
.dl-tabs{padding:0 16px;display:flex;gap:8px}
.dl-chip{height:40px;padding:0 16px;border-radius:256px;background:#fff;color:#25282b;font:500 14px/20px var(--font);white-space:nowrap;display:flex;align-items:center;cursor:pointer;flex:none}
.dl-chip.is-on{background:#ec3342;color:#fff}

/* old header (plain chevron) */
.dl-ohd{position:absolute;left:0;top:0;width:375px;z-index:5;background:#f1f1f4}
.dl-ohd--tabs{border-bottom:.5px solid rgba(0,0,0,.1);padding-bottom:12px}
.dl-ohd__bar{margin-top:44px;height:52px;position:relative}
.dl-oback{position:absolute;left:8px;top:2px;width:40px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dl-oback img{width:24px;height:24px}
.dl-ohd .dl-title{padding-top:2px}

/* BirDS press feedback (Button / Button (Icon) / Cell 100 ms, Chips 150 ms — "Animation and interaction"):
   the background takes the press token while the content scales to .95; the background layer (::before)
   counter-scales so it keeps the original bounds and the touch area does not change. */
.dl-primary,.dl-ghost,.dl-back,.dl-chip,button.dl-search__cancel,button.dl-osearch__cancel,button.dl-cell,button.dl-brow,.dl-time{position:relative}
.dl-primary,.dl-ghost,.dl-back,.dl-oback,.dl-chip,button.dl-search__cancel,button.dl-osearch__cancel,button.dl-cell,button.dl-brow,.dl-time{
  isolation:isolate;transition:transform .1s ease-out}
.dl-primary::before,.dl-ghost::before,.dl-back::before,.dl-oback::before,.dl-chip::before,button.dl-search__cancel::before,button.dl-osearch__cancel::before,
button.dl-cell::before,button.dl-brow::before,.dl-time::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  transition:transform .1s ease-out,background-color .1s ease-out}
.dl-primary:active,.dl-ghost:active,.dl-back:active,.dl-oback:active,.dl-chip:active,button.dl-search__cancel:active,button.dl-osearch__cancel:active,
button.dl-cell:active,button.dl-brow:active,.dl-time:active{transform:scale(.95)}
.dl-primary:active::before,.dl-ghost:active::before,.dl-back:active::before,.dl-oback:active::before,.dl-chip:active::before,
button.dl-search__cancel:active::before,button.dl-osearch__cancel:active::before,button.dl-cell:active::before,button.dl-brow:active::before,
.dl-time:active::before{transform:scale(1.0526);background:#e9e7e7}                 /* UI_Element_Base_pressed */
.dl-primary:active::before{background:#d12432}                                        /* UI_Element_Brand_pressed */
.dl-oback::before{inset:4px 0;border-radius:256px}
button.dl-search__cancel::before,button.dl-osearch__cancel::before{inset:0 -8px;border-radius:10px}
button.dl-cell::before,button.dl-brow::before,.dl-time::before{left:16px;right:16px;border-radius:12px}
/* Chips: default → pressed 150 ms, pressed → active instant */
.dl-chip,.dl-chip::before{transition-duration:.15s}
.dl-chip:not(.is-on):not(.is-selected):active::before{background:#e5e6e9}            /* Chips State=Hover/Pressed */
.dl-chip.is-on:active::before,.dl-chip.is-selected:active::before{background:#d12432}

  background:linear-gradient(0deg,#f5f5f7 50%,rgba(245,245,247,.991) 53.3%,rgba(245,245,247,.964) 56.6%,rgba(245,245,247,.918) 59.9%,rgba(245,245,247,.853) 63.2%,rgba(245,245,247,.768) 66.5%,rgba(245,245,247,.668) 69.8%,rgba(245,245,247,.557) 73.1%,rgba(245,245,247,.443) 76.4%,rgba(245,245,247,.332) 79.7%,rgba(245,245,247,.232) 83%,rgba(245,245,247,.147) 86.3%,rgba(245,245,247,.082) 89.6%,rgba(245,245,247,.036) 92.9%,rgba(245,245,247,.009) 96.2%,rgba(245,245,247,0) 99.5%)}

/* switch (offers) — Toggle-Switch Item iOS M-24: Active = brand track, thumb 20 px at x 16; Inactive = #f3f3f5 track,
   thumb at x 2. BirDS Switch: the thumb slides in 150 ms; pressed → track takes the press token, thumb stretches 4 px.
   The track is drawn by .dl-switch, the thumb by .dl-switch__off (class names kept for the ins1-off / ins2-off toggles). */

/* ---------- shared fragments (prefix .erx-) ---------- */

   content scales to .95 in 100 ms; the background layer (::before) counter-scales and keeps the full bounds.

.erx-btn,.erx-back,.scr--same-currency .sc__back,.sheet--what-pin .wp__close,.sheet--what-pin button.wp__chip{isolation:isolate;transition:transform .1s ease-out}
.erx-btn::before,.erx-back::before,.scr--same-currency .sc__back::before,.sheet--what-pin .wp__close::before,.sheet--what-pin button.wp__chip::before{
  content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;transition:transform .1s ease-out,background-color .1s ease-out}

<script>
/* ---------- core: render, navigation, sheets ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const device = $('#device'), pagesEl = $('#pages'), sheetsEl = $('#sheets');

const App = {
  stack: [],        // [{id, layer}]
  sheets: [],       // [{id, wrap}]
  hooks: {},        // id -> fn(root, opts)  (also matched by base id)
  actions: {},      // name -> fn(el, root, ev)
  lightBars: new Set(),

  tpl(id) { return document.querySelector(`template[data-screen="${id}"]`); },
  base(id) { return id.split('__')[0]; },
  has(id) { return !!this.tpl(id); },

  build(id, opts) {
    const t = this.tpl(id);
    if (!t) { toast('Экран «' + id + '» не найден'); return null; }
    const root = t.content.firstElementChild.cloneNode(true);
    root.dataset.screenId = id;
    if (this.translate) { try { this.translate(root); } catch (e) { console.error(e); } }
    const fn = this.hooks[id] || this.hooks[this.base(id)];
    if (fn) { try { fn(root, opts || {}); } catch (e) { console.error(e); } }
    return root;
  },
  kind(id) { const t = this.tpl(id); return t ? (t.dataset.kind || 'page') : null; },

  go(id, opts = {}) {
    if (this.kind(id) === 'sheet') return this.openSheet(id, opts);
    if (!opts.keepSheets) this.closeAllSheets(true);
    const root = this.build(id, opts); if (!root) return;
    const layer = document.createElement('div');
    layer.className = 'layer';
    layer.appendChild(root);
    const prev = this.stack[this.stack.length - 1];
    if (opts.replace && prev) { this.stack.pop(); }
    pagesEl.appendChild(layer);
    const anim = opts.anim === undefined ? (prev ? 'push' : 'none') : opts.anim;
    if (anim === 'push' && prev) {
      layer.classList.add('anim-in'); prev.layer.classList.add('anim-out');
    } else if (anim === 'fade') layer.classList.add('anim-fade');
    const cleanup = () => { $$('.layer', pagesEl).forEach(l => { if (!this.stack.find(s => s.layer === l)) l.remove(); }); };
    if (opts.replace && prev) setTimeout(() => prev.layer.remove(), anim === 'none' ? 0 : 400);
    else if (prev) setTimeout(() => { prev.layer.classList.remove('anim-out'); prev.layer.style.visibility = 'hidden'; }, anim === 'none' ? 0 : 400);
    if (opts.reset) { this.stack.forEach(s => setTimeout(() => s.layer.remove(), 420)); this.stack = []; }
    this.stack.push({ id, layer });
    setTimeout(() => layer.classList.remove('anim-in', 'anim-fade'), 420);
    this.onScreen();
    return root;
  },
  back() {
    if (this.sheets.length) return this.closeSheet();
    if (this.stack.length < 2) return;
    const cur = this.stack.pop(), prev = this.stack[this.stack.length - 1];
    prev.layer.style.visibility = '';
    prev.layer.classList.add('anim-back-in'); cur.layer.classList.add('anim-back-out');
    setTimeout(() => { cur.layer.remove(); prev.layer.classList.remove('anim-back-in'); }, 400);
    const fn = this.hooks['back:' + prev.id]; if (fn) fn(prev.layer.firstElementChild);
    this.onScreen();
  },
  replaceCurrent(id, opts = {}) {  // swap current page without animation (state switch)
    const cur = this.stack[this.stack.length - 1];
    if (!cur) return this.go(id, opts);
    const root = this.build(id, opts); if (!root) return;
    const oldScroll = cur.layer.querySelector('.scr__scroll');
    const top = oldScroll ? oldScroll.scrollTop : 0;
    cur.layer.replaceChildren(root); cur.id = id;
    const ns = root.querySelector('.scr__scroll'); if (ns && opts.keepScroll) ns.scrollTop = top;
    this.onScreen();
    return root;
  },
  openSheet(id, opts = {}) {
    const root = this.build(id, opts); if (!root) return;
    if (opts.replaceSheet && this.sheets.length) this.closeSheet(true);
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = '<div class="sheet-backdrop"></div><div class="sheet-holder"></div>';
    wrap.lastChild.appendChild(root);
    wrap.firstChild.addEventListener('click', () => { if (!opts.modal) this.closeSheet(); });
    if (!opts.modal) enableSheetDrag(wrap);
    sheetsEl.appendChild(wrap);
    this.sheets.push({ id, wrap });
    this.onScreen();
    return root;
  },
  closeSheet(instant) {
    const s = this.sheets.pop(); if (!s) return;
    if (instant) s.wrap.remove();
    else { s.wrap.classList.add('is-closing'); setTimeout(() => s.wrap.remove(), 400); }
    this.onScreen();
  },
  closeAllSheets(instant) { while (this.sheets.length) this.closeSheet(instant); },
  replaceSheet(id, opts = {}) { // state switch for the top sheet
    const s = this.sheets[this.sheets.length - 1];
    if (!s) return this.openSheet(id, opts);
    const root = this.build(id, opts); if (!root) return;
    const holder = s.wrap.querySelector('.sheet-holder');
    holder.style.animation = 'none';
    holder.replaceChildren(root); s.id = id;
    this.onScreen();
    return root;
  },
  current() { return this.sheets.length ? this.sheets[this.sheets.length - 1] : this.stack[this.stack.length - 1]; },
  currentRoot() {
    const c = this.current(); if (!c) return null;
    return c.wrap ? c.wrap.querySelector('.sheet-holder').firstElementChild : c.layer.firstElementChild;
  },
  onScreen() {
    const page = this.stack[this.stack.length - 1];
    const light = page && this.lightBars.has(this.base(page.id)) && !this.sheets.length;
    $('#statusbar').classList.toggle('is-light', !!light);
    $('#homeind').classList.toggle('is-light', !!light);
    if (this.onChange) this.onChange();
  },
};

/* swipe down on the top of a sheet (grabber / header zone) to dismiss it */
function enableSheetDrag(wrap) {
  const holder = wrap.querySelector('.sheet-holder'), back = wrap.querySelector('.sheet-backdrop');
  let y0 = null, dy = 0, t0 = 0, scale = 1;
  holder.addEventListener('pointerdown', (e) => {
    const r = holder.getBoundingClientRect();
    scale = r.height / holder.offsetHeight || 1;
    if ((e.clientY - r.top) / scale > 64 || e.target.closest('button,input,a,[data-action],[data-go]')) return;
    y0 = e.clientY; dy = 0; t0 = Date.now();
    try { holder.setPointerCapture(e.pointerId); } catch (_) { /* synthetic events */ }
    holder.style.animation = 'none'; holder.style.transition = 'none';
  });
  holder.addEventListener('pointermove', (e) => {
    if (y0 === null) return;
    dy = Math.max(0, (e.clientY - y0) / scale);
    holder.style.transform = `translateY(${dy}px)`;
    back.style.opacity = String(Math.max(0, 1 - dy / holder.offsetHeight));
  });
  const end = () => {
    if (y0 === null) return;
    const fast = dy > 40 && dy / Math.max(1, Date.now() - t0) > 0.5;
    y0 = null;
    holder.style.transition = 'transform .25s ease'; back.style.transition = 'opacity .25s ease';
    if (dy > holder.offsetHeight * 0.3 || fast) {
      holder.style.transform = 'translateY(100%)'; back.style.opacity = '0';
      setTimeout(() => { const i = App.sheets.findIndex(s => s.wrap === wrap); if (i > -1) { App.sheets.splice(i, 1); wrap.remove(); App.onScreen(); } }, 250);
    } else { holder.style.transform = ''; back.style.opacity = ''; }
  };
  holder.addEventListener('pointerup', end); holder.addEventListener('pointercancel', end);
}

let toastTimer;
function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('is-on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('is-on'), ms);
}

/* ---------- event delegation ---------- */
device.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-go],[data-action],[data-toggle],[data-key]');
  if (!el || !device.contains(el)) return;
  const root = el.closest('.scr,.sheet');
  if (el.dataset.toggle) { root && root.classList.toggle(el.dataset.toggle); }

  const a = el.dataset.action;
  if (!a) return;
  if (App.actions[a]) { App.actions[a](el, root, ev); return; }
  if (a === 'back') return App.back();
  if (a === 'close') return App.closeSheet();
  if (a !== 'noop') toast('Действие «' + a + '» не входит в прототип');
});

/* ---------- fit the device to the window ---------- */
function fit() {
  const w = innerWidth, h = innerHeight;
  const bare = w < 520;
  document.body.classList.toggle('is-bare', bare);
  const s = bare ? Math.min(w / 375, h / 812) : Math.min(1, (h - 70) / 812, (w - 40) / 375);
  device.style.transform = `scale(${s})`;
}

{"src": ["Birbank kartlarına 0% komissiya ilə köçürməDigər bank kartlarına fərdi limit daxilində komissiyasız köçürmə edə bilərsiniz. Limiti keçdikdə isə komissiya 0,5% təşkil edəcək (minimum 1 AZN/USD/EUR)."], "en": "Transfers to Birbank cards with 0% commission\nYou can transfer money to cards of other banks without commission within your individual limit. If the limit is exceeded, a commission of 1% will apply (minimum 1 AZN/USD/EUR). For more details, see the “Tariffs” section on our website.", "az": "Birbank kartlarına 0% komissiya ilə köçürməDigər bank kartlarına fərdi limit daxilində komissiyasız köçürmə edə bilərsiniz. Limiti keçdikdə isə komissiya 0,5% təşkil edəcək (minimum 1 AZN/USD/EUR).", "ru": "Переводы на карты Birbank с комиссией 0%\nВы можете переводить деньги на карты других банков без комиссии в пределах индивидуального лимита. При превышении лимита комиссия составит 1% (минимум 1 AZN/USD/EUR). Подробнее в разделе «Тарифы» на нашем сайте.", "from": "ds", "var": "Cards order and delivery/transfer_without_commission + Cards order and delivery/transfer_within_limit", "collection": "Birbank App texts"}, {"src": ["Limit daxilində komissiyasız nağdlaşdırmaFərdi limiti keçdikdə komissiya 1% təşkil edəcək (minimum 1 AZN/USD/EUR). Daha ətraflı saytımızın “Tariflər” bölməsində."], "en": "Cash withdrawals without commission within limit\nIf the individual limit is exceeded, a commission of 1% will apply (minimum 1 AZN/USD/EUR). For more details, see the “Tariffs” section on our website.", "az": "Limit daxilində komissiyasız nağdlaşdırmaFərdi limiti keçdikdə komissiya 1% təşkil edəcək (minimum 1 AZN/USD/EUR). Daha ətraflı saytımızın “Tariflər” bölməsində.", "ru": "Снятие наличных без комиссии в пределах лимита\nПри превышении индивидуального лимита комиссия составит 1% (минимум 1 AZN/USD/EUR). Подробнее в разделе «Тарифы» на нашем сайте.", "from": "ds", "var": "Cards order and delivery/withdrawal_within_limit + BB products/Cards/if_individual_limit_exceeded", "collection": "Birbank App texts"}, {"src": ["Partnyorlardan bonuslarPartnyorlarımızın mağazalarında alış-veriş edin və bonuslar qazanın."], "en": "Bonuses from partners\nShop at our partner stores and earn bonuses.", "az": "Partnyorlardan bonuslarPartnyorlarımızın mağazalarında alış-veriş edin və bonuslar qazanın.", "ru": "Бонусы от партнеров\nВозможность получать бонусы за покупки в магазинах наших партнеров", "from": "ds", "var": "bonuses_from_partners + shop_at_stores_earn_bonuses", "collection": "Birbank App texts"}, {"src": ["Balansın 3 000 ₼-dək komissiyasız artırılmasıFiliallar, şöbələr və ya terminallar vasitəsilə ay ərzində kartınızın balansını 3 000 ₼-dan çox artırdıqda məbləğin limiti keçən hissəsinə 0,5% komissiya tətbiq olunur"], "en": "Top-up without commission up to 3 000 ₼\nWhen topping up your card balance via branches, offices, or terminals by more than 3 000 ₼, a 0,5% fee applies to the amount exceeding the limit", "az": "Balansın 3 000 ₼-dək komissiyasız artırılmasıFiliallar, şöbələr və ya terminallar vasitəsilə ay ərzində kartınızın balansını 3 000 ₼-dan çox artırdıqda məbləğin limiti keçən hissəsinə 0,5% komissiya tətbiq olunur", "ru": "Пополнение баланса без комиссии до 3 000 ₼\nПри пополнении баланса карты через филиалы, отделения или терминалы на сумму более 3 000 ₼, на превышающую лимит часть применяется комиссия 0,5%", "from": "ds", "var": "BB products/Cards/header_top_up_without_commission_3000 + BB products/Cards/body_top_up_without_commission_3000", "collection": "Birbank App texts"}, {"src": ["AZN, USD, EUR valyutasında"], "en": "In AZN, USD, EUR", "az": "AZN, USD, EUR valyutasında", "ru": "В валюте AZN, USD, EUR", "from": "manual"}, {"src": ["Referal kodum var"], "en": "I have a referral code", "az": "Referal kodum var", "ru": "У меня есть реферальный код", "from": "ds", "var": "Cards order and delivery/i_have_referral_code", "collection": "Birbank App texts"}, {"src": ["Referal kodu sizinlə yalnız Birbank Cashback kartı sahibi paylaşa bilər. Əgər bu sizin ilk Birbank Cashback debet kartınızdırsa, onunla etdiyiniz ilk ödənişdən 3 ₼ qazanacaqsınız."], "en": "Only a Birbank Cashback cardholder can share a referral code with you. If this is your first Birbank Cashback debit card, you will earn 3 ₼ from your first payment with it.", "az": "Referal kodu sizinlə yalnız Birbank Cashback kartı sahibi paylaşa bilər. Əgər bu sizin ilk Birbank Cashback debet kartınızdırsa, onunla etdiyiniz ilk ödənişdən 3 ₼ qazanacaqsınız.", "ru": "Поделиться с вами реферальным кодом может только владелец карты Birbank Cashback. Если это ваша первая дебетовая карта Birbank Cashback, вы получите 3 ₼ за первый платёж по ней.", "from": "manual"}, {"src": ["Referal kodu", "Referral code"], "en": "Referral code", "az": "Referal kodu", "ru": "Реферальный код", "from": "ds", "var": "Cards order and delivery/referral_code", "collection": "Birbank App texts"}, {"src": ["Siz bu koddan artıq istifadə etmisiniz"], "en": "You have already used this code", "az": "Siz bu koddan artıq istifadə etmisiniz", "ru": "Вы уже использовали этот код", "from": "ds", "var": "Cards order and delivery/you_already_used_this_code", "collection": "Birbank App texts"}, {"src": ["18 ayadək taksitPartnyorlarımızın mağazalarında etdiyiniz alış-verişlərinizi faizsiz hissə-hissə ödəyin."], "en": "Installment up to 18 months\nPay for your purchases at our partners' stores in installments without interest.", "az": "18 ayadək taksitPartnyorlarımızın mağazalarında etdiyiniz alış-verişlərinizi faizsiz hissə-hissə ödəyin.", "ru": "Рассрочка до 18 месяцев\nОплачивайте покупки в магазинах наших партнеров в рассрочку без процентов.", "from": "ds", "var": "Installment up to 18 months + Pay for your purchases at our partners' stores in installments without interest", "collection": "Birbank App texts"}, {"src": ["Grace period up to 63 daysThe maximum grace period for repayment of the amount spent without interest is 63 days. After this period, interest on the remaining debt will be charged at a rate of 1.84% to 2.92% per month."], "en": "Grace period up to 63 daysThe maximum grace period for repayment of the amount spent without interest is 63 days. After this period, interest on the remaining debt will be charged at a rate of 1.84% to 2.92% per month.", "az": "63 günədək güzəşt müddəti\nXərclədiyiniz məbləği faizsiz qaytarmaq üçün maksimal güzəşt müddəti 63 gündür. Güzəşt müddəti başa çatdıqda aylıq 1,84%-dən 2,92%-dək kredit faizi hesablanacaq.", "ru": "Льготный период до 63 дней\nМаксимальный льготный период для возврата потраченной суммы без процентов составляет 63 дня. После этого срока на оставшуюся сумму долга будет начисляться процент по кредиту от 1,84% до 2,92% в месяц.", "from": "ds", "var": "Grace period up to 63 days + The maximum grace period for repayment of the amount spent without interest is 63", "collection": "Translation"}, {"src": ["Ayda 30 000-dək səyahət miliÖlkədaxili ödənişlər üçün hər 2 ₼ minimum 1 mil, ölkəxarici ödənişlər üçün isə 1 ₼ 1 mil olaraq hesablanacaq. Partnyorlarımızda alış-veriş edərək daha çox mil əldə edə biləcəksiniz."], "en": "Up to 30 000 miles per month\nFor domestic payments, you will earn at least 1 mile for every 2 ₼, and for international payments — 1 mile per 1 ₼. Shop with our partners to earn more miles.", "az": "Ayda 30 000-dək səyahət miliÖlkədaxili ödənişlər üçün hər 2 ₼ minimum 1 mil, ölkəxarici ödənişlər üçün isə 1 ₼ 1 mil olaraq hesablanacaq. Partnyorlarımızda alış-veriş edərək daha çox mil əldə edə biləcəksiniz.", "ru": "До 30 000 миль в месяц\nЗа внутренние платежи вам будет начисляться минимум 1 миля за каждые 2 ₼, а за зарубежные — 1 миля за каждый 1 ₼. Покупайте у наших партнеров, чтобы зарабатывать больше миль.", "from": "ds", "var": "BB products/Cards/up_to_30000_miles_per_month + BB products/Cards/during_domestic_payments_one_manat_one_mile", "collection": "Birbank App texts"}, {"src": ["30 000 ₼-dək kredit limitiLimit fərdi olaraq müəyyən edilir və kart sifarişindən dərhal sonra istifadəyə hazırdır."], "en": "Credit limit up to 30 000 ₼\nThe limit is set individually and is available right after you order the card.", "az": "30 000 ₼-dək kredit limitiLimit fərdi olaraq müəyyən edilir və kart sifarişindən dərhal sonra istifadəyə hazırdır.", "ru": "Кредитный лимит до 30 000 ₼\nЛимит устанавливается индивидуально и доступен сразу после заказа карты.", "from": "manual"}, {"src": ["Faizsiz taksitlə alış-verişPartnyorlarımızın mağazalarında etdiyiniz alış-verişləri faizsiz hissə-hissə ödəyin."], "en": "Enjoy interest-free installment payments\nPay for your purchases at our partners' stores in installments without interest.", "az": "Faizsiz taksitlə alış-veriş edin\nPartnyorlarımızın mağazalarında etdiyiniz alış-verişlərinizi faizsiz hissə-hissə ödəyin.", "ru": "Совершайте покупки в рассрочку без процентов\nОплачивайте покупки в магазинах наших партнеров в рассрочку без процентов.", "from": "ds", "var": "Cards order and delivery/interest_free_installment_payments + Pay for your purchases at our partners' stores in installments without interest", "collection": "Birbank App texts"}, {"src": ["63 günədək güzəşt müddətiXərclənmiş məbləği 63 gün ərzində faizsiz qaytara bilərsiniz."], "en": "Grace period up to 63 days\nYou can repay the amount spent within 63 days without interest.", "az": "63 günədək güzəşt müddətiXərclənmiş məbləği 63 gün ərzində faizsiz qaytara bilərsiniz.", "ru": "Льготный период до 63 дней\nПотраченную сумму можно вернуть без процентов в течение 63 дней.", "from": "ds", "var": "Cards order and delivery/grace_period_sixty_three_days", "collection": "Birbank App texts"}, {"src": ["“Visa Concierge” xidmətləriBirbank Platinum kartı ilə ödənişlər edin və “Visa Concierge” xidmətlərindən 24/7 yararlanın."], "en": "Visa Concierge\nMake payments with your Birbank Platinum card and enjoy the benefits of Visa Concierge services.", "az": "“Visa Concierge” xidməti\nBirbank Platinum kartı ilə ödənişlər edin və “Visa Concierge” xidmətlərindən yararlanın.", "ru": "Сервис «Visa Concierge»\nОплачивайте покупки картой Birbank Platinum и пользуйтесь услугами «Visa Concierge».", "from": "ds", "var": "BB products/Cards/header_visa_concierge_service + BB products/Cards/desc_birbank_platinum_features", "collection": "Birbank App texts"}, {"src": ["Əlavə Umico bonuslarıHər ödənişdən 1.9%-dək əlavə Umico bonusları qazanın."], "en": "Extra Umico bonuses\nEarn up to 1.9% extra Umico bonuses on every payment.", "az": "Əlavə Umico bonuslarıHər ödənişdən 1.9%-dək əlavə Umico bonusları qazanın.", "ru": "Дополнительные бонусы Umico\nПолучайте до 1,9% дополнительных бонусов Umico за каждый платёж.", "from": "manual"}, {"src": ["Birbank kartlarına 0% komissiya ilə köçürməDigər bank kartlarına fərdi limit daxilində komissiyasız köçürmə edə bilərsiniz."], "en": "Transfers to Birbank cards with 0% commission\nYou can transfer money to cards of other banks without commission within your individual limit.", "az": "Birbank kartlarına 0% komissiya ilə köçürməDigər bank kartlarına fərdi limit daxilində komissiyasız köçürmə edə bilərsiniz.", "ru": "Переводы на карты Birbank с комиссией 0%\nВы можете переводить деньги на карты других банков без комиссии в пределах индивидуального лимита.", "from": "ds", "var": "Cards order and delivery/transfer_without_commission + Cards order and delivery/transfer_within_limit", "collection": "Birbank App texts"}, {"src": ["Valyuta seçimi edin"], "en": "Choose a currency", "az": "Valyuta seçimi edin", "ru": "Выберите валюту", "from": "ds", "var": "Common wordings/HEADER_Choose_a_currency", "collection": "Birbank App texts"}, {"src": ["Continue", "Davam et"], "en": "Continue", "az": "Davam et", "ru": "Продолжить", "from": "ds", "var": "continue_common", "collection": "COMMONS"}, {"src": ["Zəhmət olmasa, gözləyin"], "en": "Please wait", "az": "Zəhmət olmasa, gözləyin", "ru": "Пожалуйста, подождите", "from": "ds", "var": "please_wait", "collection": "Birbank App texts"}, {"src": ["Məlumatlar r and delivery/delivery_of_card", "collection": "Birbank App texts"}, {"src": ["Card is being prepared at the branch"], "en": "Card is being prepared at the branch", "az": "Kart filialda hazırlanır", "ru": "Карта готовится в филиале", "from": "manual"}, {"src": ["You can pick up your card at {branch-name} within 5–7 working days."], "en": "You can pick up your card at the {branch-name} branch within 5‑7 business days", "az": "Kartınızı 5-7 iş günü ərzində {branch-name} filialından götürə bilərsiniz", "ru": "Вы можете забрать карту в филиале {branch-name} в течение 5‑7 рабочих дней", "from": "ds", "var": "Cards order and delivery/pick_up_card_at_branch", "collection": "Birbank App texts"}, {"src": ["Kartınızı 5-7 iş günü ərzində {branch} filialından götürə bilərsiniz"], "en": "You can pick up your card at the {branch} branch within 5‑7 business days", "az": "Kartınızı 5-7 iş günü ərzində {branch} filialından götürə bilərsiniz", "ru": "Вы можете забрать карту в филиале {branch} в течение 5‑7 рабочих дней", "from": "ds", "var": "Cards order and delivery/pick_up_card_at_branch", "collection": "Birbank App texts"}, {"src": ["Fiziki kartı əlavə ödənişlə sifariş edə bilərsiniz"], "en": "You can order a physical card for an additional fee", "az": "Fiziki kartı əlavə ödənişlə sifariş edə bilərsiniz", "ru": "Физическую карту можете заказать за отдельную плату", "from": "ds", "var": "Cards order and delivery/Order card ERRORS/header_physical_card_order_amount", "collection": "Birbank App texts"}, {"src": ["Sizin artıq bu valyutada bir fiziki kartınız olduğu üçün hər digər eyni valyutalı fiziki kartı {fee} ödəniş edərək əldə edəcəksiniz. Rəqəmsal kartınızdan istifadə etməyə davam edə bilərsiniz."], "en": "You already have a physical card in this currency, so each additional one in the same currency will cost {fee}. You can continue using your digital card.", "az": "Sizin artıq bu valyutada bir fiziki kartınız olduğu üçün hər digər eyni valyutalı fiziki kartı {fee} ödəniş edərək əldə edəcəksiniz. Rəqəmsal kartınızdan istifadə etməyə davam edə bilərsiniz.", "ru": "У вас уже есть физическая карта в этой валюте, поэтому каждая дополнительная карта в той же валюте будет стоить {fee}. Вы можете продолжать пользоваться цифровой картой.", "from": "ds", "var": "Cards order and delivery/Order card ERRORS/body_physical_card_order_amount", "collection": "Birbank App texts"}, {"src": ["Rəqəmsal kartın üstünlükləri"], "en": "Benefits of the digital card", "az": "Rəqəmsal kartın üstünlükləri", "ru": "Преимущества цифровой карты", "from": "ds", "var": "benefits_of_the_digital_card", "collection": "Birbank App texts"}, {"src": ["Sifariş et"], "en": "Order", "az": "Sifariş et", "ru": "Заказать", "from": "ds", "var": "order_common", "collection": "COMMONS"}, {"src": ["Sifarişinizi qəbul etdik"], "en": "We have received your order", "az": "Sifarişinizi qəbul etdik", "ru": "Мы приняли ваш заказ", "from": "ds", "var": "Cards order and delivery/header_we_have_received_order", "collection": "Birbank App texts"}, {"src": ["Sifarişiniz təsdiqləndikdən sonra kartınız Birbank tətbiqinin əsas səhifəsində əks olunacaq. Bundan sonra rəqəmsal kartınızla ödənişlər edə və ya istədiyiniz zaman onun fiziki formasını sifariş edə bilərsiniz."], "en": "Once we confirm your order, you will see the card on the main page of the Birbank app. After that, you can make purchases with the digital card or order its physical version at any time.", "az": "Sifarişiniz təsdiqləndikdən sonra kartınız Birbank tətbiqinin əsas səhifəsində əks olunacaq. Bundan sonra rəqəmsal kartınızla ödənişlər edə və ya istədiyiniz zaman onun fiziki formasını sifariş edə bilərsiniz.", "ru": "Когда мы подтвердим ваш заказ, вы увидите карту на главной странице приложения Birbank. После этого вы сможете оплачивать покупки с помощью цифровой карты или заказать ее физическую версию в любое время.", "from": "ds", "var": "Cards order and delivery/body_we_have_received_order", "collection": "Birbank App texts"}, {"src": ["Əsas səhifəyə keç", "Go to main", "Go to main page"], "en": "Go to main", "az": "Əsas səhifəyə keç", "ru": "Перейти на главную", "from": "ds", "var": "Cards order and delivery/button_go_to_main", "collection": "Birbank App texts"}, {"src": ["Rəqəmsal kart telefonunuzda olan və plastik kart kimi işləyən, lakin ondan bəzi üstünlüklərə malik bank kartıdır."], "en": "A digital card is a bank card in your phone that works like a plastic one but has some advantages over it:", "az": "Rəqəmsal kart telefonunuzda olan və plastik kart kimi işləyən, lakin ondan bəzi üstünlüklərə malik bank kartıdır.", "ru": "Цифровая карта — это банковская карта в вашем телефоне, которая работает как пластиковая, но имеет некоторые преимущества перед ней.", "from": "ds", "var": "A digital card is a bank card in your phone that works like a plastic one but has some advantages over it", "collection": "BB Products"}, {"src": ["Kartınızı itirməyəcəksiniz"], "en": "You won't lose your card", "az": "Kartınızı itirməyəcəksiniz", "ru": "Вы не потеряете свою карту", "from": "ds", "var": "You won't lose your card", "collection": "BB Products"}, {"src": ["Kartınız hər zaman sizinlədir. Rəqəmsal formatda olduğu üçün itirilməyəcək."], "en": "Your card is always with you. Thanks to its digital format, it won't get lost.", "az": "Kartınız hər zaman sizinlədir. Rəqəmsal formatda olduğu üçün itirilməyəcək.", "ru": "Ваша карта всегда с вами. Благодаря цифровому формату, она не потеряется.", "from": "ds", "var": "No need to worry — your card is always with you in your phone and will never get lost", "collection": "BB Products"}, {"src": ["Kartınız həmişə telefonunuzdadır"], "en": "Your card is always in your phone", "az": "Kartınız həmişə telefonunuzdadır", "ru": "Карта всегда в вашем телефоне", "from": "ds", "var": "Your card is always in your phone", "collection": "BB Products"}, {"src": ["Pul kisəsini unutmusunuzsa, narahat olmayın! Ödənişlərinizi Google Pay və ya Apple Pay ilə həyata keçirin."], "en": "Don't worry if you forget your wallet – you can make purchases using Google Pay or Apple Pay.", "az": "Pul kisəsini unutmusunuzsa, narahat olmayın! Ödənişlərinizi Google Pay və ya Apple Pay ilə həyata keçirin.", "ru": "Не волнуйтесь, если забыли кошелек – оплатите покупки с помощью Google Pay или Apple Pay.", "from": "ds", "var": "Don't worry if you forget your wallet – you can make purchases using Google Pay or Apple Pay", "collection": "BB Products"}, {"src": ["Siz meşələrin qırılmasını azaltmağa kömək edirsiniz"], "en": "You help reduce deforestation", "az": "Siz meşələrin qırılmasını azaltmağa kömək edirsiniz", "ru": "Вы помогаете сократить вырубку лесов", "from": "ds", "var": " You help reduce deforestation", "collection": "BB Products"}, {"src": ["Plastik kart və kağız sənədləri çap etməyə ehtiyac olmadığına görə, rəqəmsal kart seçməklə siz meşələrin qorunmasına kömək edirsiniz."], "en": "By choosing a digital card, you help preserve forests as there is no need to print plastic cards and paper documents.", "az": "Plastik kart və kağız sənədləri çap etməyə ehtiyac olmadığına görə, rəqəmsal kart seçməklə siz meşələrin qorunmasına kömək edirsiniz.", "ru": "Выбирая цифровую карту, вы помогаете сохранять леса, так как нет необходимости в печати пластиковых карт и бумажных документов.", "from": "ds", "var": "By choosing a digital card, you help preserve forests as there is no need to print plastic cards and paper documents", "collection": "BB Products"}, {"src": ["Növbəti", "Next"], "en": "Next", "az": "Növbəti", "ru": "Далее", "from": "ds", "var": "next_common", "collection": "COMMONS"}, {"src": ["Aydındır"], "en": "Got it", "az": "Aydındır", "ru": "Понятно", "from": "ds", "var": "got_it", "collection": "Birbank App texts"}, {"src": ["Search"], "en": "Search", "az": "Axtar", "ru": "Поиск", "from": "ds", "var": "Search", "collection": "Birbank App texts"}, {"src": ["Cancel"], "en": "Cancel", "az": "Ləğv et", "ru": "Отменить", "from": "ds", "var": "cancel_common", " istəyir.", "ru": "Birbank хочет получить доступ к вашей геопозиции.", "from": "ds", "var": "Access to location", "collection": "Birbank App texts"}, {"src": ["To delivery"], "en": "For card delivery", "az": "Kartın çatdırılması üçün", "ru": "Для доставки карты", "from": "manual"}, {"src": ["Don’t Allow", "İcazə vermə"], "en": "Don't allow", "az": "İcazə vermə", "ru": "Не разрешать", "from": "ds", "var": "Don't allow", "collection": "Translation"}, {"src": ["OK"], "en": "OK", "az": "OK", "ru": "OK", "from": "ds", "var": "ok_common", "collection": "COMMONS"}, {"src": ["Birbankın geolokasiyanıza daxil olmaq üçün icazəsi yoxdur. İcazə vermək üçün tənzimləmələrə keçin."], "en": "Birbank doesn't have access to your location. Go to settings to allow access.", "az": "Birbankın geolokasiyanıza daxil olmaq üçün icazəsi yoxdur. İcazə vermək üçün tənzimləmələrə keçin.", "ru": "У приложения Birbank нет доступа к вашей геопозиции. Перейдите в настройки, чтобы разрешить доступ.", "from": "ds", "var": "No access to location", "collection": "Translation"}, {"src": ["Tənzimləmələrə keç"], "en": "Go to settings", "az": "Tənzimləmələrə keç", "ru": "Перейти в настройки", "from": "ds", "var": "Go to settings", "collection": "Translation"}, {"src": ["Sorğunuz üzrə heç bir nəticə tapılmadı"], "en": "No results found for your request", "az": "Sorğunuz üzrə heç bir nəticə tapılmadı", "ru": "По вашему запросу ничего не найдено", "from": "ds", "var": "not_found_error", "collection": "COMMONS"}, {"src": ["Bu ünvana çatdırılma hələ ki mümkün deyil"], "en": "We don’t deliver to this address yet", "az": "Bu ünvana çatdırılma hələ ki mümkün deyil", "ru": "Пока не доставляем по этому адресу", "from": "ds", "var": "Cards order and delivery/we_dont_deliver_to_this_address", "collection": "Birbank App texts"}, {"src": ["Zəhmət olmasa, başqa ünvan qeyd edin və ya kartı özünüz götürə biləcəyiniz filialı seçin."], "en": "Please enter a different address or choose a branch where you can pick up your card yourself.", "az": "Zəhmət olmasa, başqa ünvan qeyd edin və ya kartı özünüz götürə biləcəyiniz filialı seçin.", "ru": "Пожалуйста, укажите другой адрес или выберите филиал, где сможете забрать карту самостоятельно.", "from": "ds", "var": "Cards order and delivery/enter_different_address_or_choose_branch", "collection": "Birbank App texts"}, {"src": ["Filial seç"], "en": "Choose a branch", "az": "Filial seç", "ru": "Выбрать филиал", "from": "ds", "var": "Cards order and delivery/button_choose_branch", "collection": "Birbank App texts"}, {"src": ["Başqa ünvan qeyd et"], "en": "Enter a different address", "az": "Başqa ünvan qeyd et", "ru": "Указать другой адрес", "from": "ds", "var": "Cards order and delivery/button_enter_different_address", "collection": "Birbank App texts"}, {"src": ["Edit adress"], "en": "Edit address", "az": "Ünvanı dəyiş", "ru": "Изменить адрес", "from": "ds", "var": "Cards order and delivery/edit_address", "collection": "Birbank App texts"}, {"src": ["Çatdırılma tarixi və vaxtını seçin"], "en": "Choose delivery date and time", "az": "Çatdırılma tarixi və vaxtını seçin", "ru": "Выберите дату и время доставки", "from": "ds", "var": "Cards order and delivery/choose_delivery_date_time", "collection": "Birbank App texts"}, {"src": ["13 avqust, Bazar ertəsi"], "en": "13 August, Monday", "az": "13 avqust, Bazar ertəsi", "ru": "13 августа, понедельник", "from": "manual"}, {"src": ["14 avqust, Çərşənbə axşamı"], "en": "14 August, Tuesday", "az": "14 avqust, Çərşənbə axşamı", "ru": "14 августа, вторник", "from": "manual"}, {"src": ["Kuryer üçün məlumat"], "en": "Information for the courier", "az": "Kuryer üçün məlumat", "ru": "Информация для курьера", "from": "ds", "var": "Cards order and delivery/information_for_courier", "collection": "Birbank App texts"}, {"src": ["Kartınızı “Wolt” kuryeri çatdıracaq"], "en": "A “Wolt” courier will deliver your card", "az": "Kartınızı “Wolt” kuryeri çatdıracaq", "ru": "Вашу карту доставит курьер «Wolt»", "from": "ds", "var": "Cards order and delivery/wolt_courirer_deliver_card", "collection": "Birbank App texts"}, {"src": ["Ünvan məlumatları"], "en": "Address details", "az": "Ünvan məlumatları", "ru": "Детали адреса", "from": "ds", "var": "Cards order and delivery/address_details", "collection": "Birbank App texts"}, {"src": ["Kuryer üçün qeyd (mütləq deyil)"], "en": "Note for courier (optional)", "az": "Kuryer üçün qeyd (mütləq deyil)", "ru": "Примечание для курьера (необязательно)", "from": "ds", "var": "Cards order and delivery/note_for_courier", "collection": "Birbank App texts"}, {"src": ["Qapı nömrəsi, mərtəbə və s."], "en": "Door number, floor, etc.", "az": "Qapı nömrəsi, mərtəbə və s.", "ru": "Номер двери, этаж и т. д.", "from": "ds", "var": "Cards order and delivery/door_number_floor_etc", "collection": "Birbank App texts"}, {"src": ["You can get the card within 5-7 working days by approaching the branch."], "en": "You can get the card within 5-7 working days by approaching the branch.", "az": "Kartı 5-7 iş günü ərzində filiala yaxınlaşaraq götürə bilərsiniz.", "ru": "Вы можете забрать карту в филиале в течение 5–7 рабочих дней.", "from": "manual"}, {"src": ["Şəxsi məlumatlarınızı dələduzlardan sığortalayın"], "en": "Insure your personal data against fraudsters", "az": "Şəxsi məlumatlarınızı dələduzlardan sığortalayın", "ru": "Застрахуйте свои персональные данные от мошенников", "from": "ds", "var": "BB products/Insurances/insure_your_data_against_fraudsters", "collection": "Birbank App texts"}, {"src": ["Kredit kartınızın limitinin 0,35%-i məbləğində xidmət haqqı ilə fərdi məlumatlarınızı gözlənilməz dələduzluq hallarından sığortalayın."], "en": "Insure your personal data against unexpected fraud cases by paying 0,35% of your credit card limit.", "az": "Kredit kartınızın limitinin 0,35%-i məbləğində xidmət haqqı ilə fərdi məlumatlarınızı gözlənilməz dələduzluq hallarından sığortalayın.", "ru": "Застрахуйте свои персональные данные от неожиданных случаев мошенничества, заплатив 0,35% от лимита вашей кредитной карты.", "from": "ds", "var": "BB products/Insurances/desc_insure_your_data_against_fraudsters", "collection": "Birbank App texts"}, {"src": ["Sığorta şərtlərini ətraflı göstər", "Show detailed terms of insurance"], "en": "Show detailed terms of insurance", "az": "Sığorta şərtlərini ətraflı göstər", "ru": "Показать подробнее условия страхования", "from": "ds", "var": "BB products/Insurances/show_detailed_terms_of_insurance", "collection": "Birbank App texts"}, {"src": ["Kartımı sığortala"], "en": "Insure my card", "az": "Kartımı sığortala", "ru": "Застраховать карту", "from": "ds", "var": "BB products/Insurances/insure_my_card", "collection": "Birbank App texts"}, {"src": ["Kredit kartların fiziki zədələnmədən sığortası (Card damage)"], "en": "Credit card physical damage insurance (Card damage)", "az": "Kredit kartların fiziki zədələnmədən sığortası (Card damage)", "ru": "Страхование карт от повреждений (Card damage)", "from": "ds", "var": "BB products/Insurances/credit_card_damage_insurance", "collection": "Birbank App texts"}, {"src": ["İllik 1 ₼ xidmət haqqı ödəyərək kredit kartınızı sığortalayın, onu fiziki zədələdikdə və ya itirdikdə əlavə xərclərsiz yenisi ilə əvəz edin."], "en": "By paying 1 ₼ for annual service, you insure your credit card to replace it without extra costs in case of damage or loss.", "az": "İllik 1 ₼ xidmət haqqı ödəyərək kredit kartınızı sığortalayın, onu fiziki zədələdikdə və ya itirdikdə əlavə xərclərsiz yenisi ilə əvəz edin.", "ru": "Оплачивая 1 ₼ за годовое обслуживание вы страхуете свою кредитную карту, чтобы заменить её без дополнительных затрат в случае повреждения или утери.", "from": "ds", "var": "BB products/Insurances/desc_credit_card_damage_insurance", "collection": "Birbank App texts"}, {"src": ["Additional offers"], "en": "Additional offers", "az": "Əlavə təkliflər", "ru": "Дополнительные предложения", "from": "manual"}, {"src": ["Yaşınız 18-dən az olduğu üçün davam etmək mümkün olmadı. Valideynlərinizlə birlikdə istənilən filialımıza yaxınlaşa bilərsiniz."], "en": "Unable to proceed because you are under 18 years old. You can visit any of our branches together with your parents.", "az": "Yaşınız 18-dən az olduğu üçün davam etmək mümkün olmadı. Valideynlərinizlə birlikdə istənilən filialımıza yaxınlaşa bilərsiniz.", "ru": "Невозможно продолжить, так как вам меньше 18 лет. Вы можете обратиться в любой наш филиал вместе с родителями.", "from": "ds", "var": "Cards order and delivery/Order card ERRORS/under_18_years_visit_branch_with_parent", "collection": "Birbank App texts"}, {"src": ["Filiallar siyahısına keç", "Show to the branch list"], "en": "Go to the branch list", "az": "Filiallar siyahısına keç", "ru": "Перейти к списку филиалов", "from": "ds", "var": "Main/Redesign/go_to_the_branch_list", "collection": "Birbank App texts"}, {"src": ["Şəxsiyyət vəsiqənizin müddəti bitdiyi üçün davam etmək mümkün olmadı. Vəsiqənizi yenilədikdən sonra yenidən cəhd edin."], "en": "Unable to proceed because your ID card has expired. Try again after updating your ID.", "az": "Şəxsiyyət vəsiqənizin müddəti bitdiyi üçün davam etmək mümkün olmadı. Vəsiqənizi yenilədikdən sonra yenidən cəhd edin.", "ru": "Невозможно продолжить, так как срок действия вашего удостоверения личности истек. Повторите попытку еще раз после того, как обновите его.", "from": "ds", "var": "Cards order and delivery/Order card ERRORS/update_your_id_and_try_again", "collection": "Birbank App texts"}, {"src": ["Balansı mənfi olan kartınız olduğu üçün yeni debet kartı almağınız mümkün olmadı. Kartınızın balansını artırın və yenidən cəhd edin."], "en": "You cannot order a new debit card because you have a card with a negative balance. Please top up the card and try ordering a new one again.", "az": "Balansı mənfi olan kartınız olduğu üçün yeni debet kartı almağınız mümkün olmadı. Kartınızın balansını artırın və yenidən cəhd edin.", "ru": "Вы не можете оформить новую дебетовую карту, так как у вас есть   const nk = s => String(s).replace(/[ ​ ]/g, ' ').replace(/[’‘`]/g, "'").replace(/[“”«»„]/g, '"')
    .replace(/[‑–—−]/g, '-').replace(/\s+/g, ' ').trim().toLowerCase();
  const I18N_INDEX = new Map();

  const NON_INLINE_SEL = '*:not(br):not(span):not(b):not(strong):not(i):not(em):not(a):not(small)';
  function unitText(el) {
    let s = '';
