<style>

/* ================= add-card ================= */

.sheet--add-card .ac-hero__title{display:block;width:293px;padding-top:3px;font:700 28px/32px var(--font);letter-spacing:-.1px;text-align:center;color:rgba(0,0,0,.9)}

.sheet--add-card.tab-daily .ac-chip[data-in~="daily"],
.sheet--add-card.tab-travel .ac-chip[data-in~="travel"],
.sheet--add-card.tab-premium .ac-chip[data-in~="premium"]{display:flex}
.sheet--add-card .ac-chip__left{display:flex;flex:none;min-height:60px;padding:12px 12px 12px 0}
.sheet--add-card .ac-chip__card{position:relative;width:58px;height:40px;border-radius:7px;overflow:hidden}
.sheet--add-card .ac-chip__shadow{position:absolute;left:-17.9px;top:9.06px;width:93.89px;height:56.89px;max-width:none}
.sheet--add-card .ac-chip__skin{position:absolute;inset:0;width:100%;height:100%}
.sheet--add-card .ac-chip__pay{position:absolute;left:5px;top:2px;width:16px;height:16px}
.sheet--add-card .ac-chip__dot{position:absolute;right:2px;top:2px;width:16px;height:16px}
.sheet--add-card .ac-chip__body{display:flex;flex:1;flex-direction:column;justify-content:center;gap:1px;min-width:0;min-height:64px;padding-bottom:1px}
.sheet--add-card .ac-chip__name{display:flex;align-items:center;gap:4px;min-height:24px;font:600 16px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9);white-space:nowrap}
.sheet--add-card .ac-chip--sm .ac-chip__name{font-size:14px;color:#25282b}
.sheet--add-card .ac-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;min-height:16px;padding:0 4px .5px;border-radius:24px;background:#f1f1f4;font:500 10px/12px var(--font);color:#20b649}

.sheet--add-card .ac-div{display:flex;flex-direction:column;gap:4px;margin-top:8px;background:rgba(0,0,0,.05)}

.sheet--add-card .ac-cells{margin-top:8px}

.sheet--add-card .ac-cell__box--activate img{left:-18.18%;top:11.36%;width:131.82%;height:90.91%}
.sheet--add-card .ac-cell__box--attach img{left:-6.02%;top:18.18%;width:118.64%;height:81.82%}
.sheet--add-card .ac-cell__body{display:flex;flex:1;align-items:center;gap:12px;min-width:0}
.sheet--add-card .ac-cell__txt{display:flex;flex:1;flex-direction:column;justify-content:center;min-width:0;min-height:64px;padding:8px 0}
.sheet--add-card .ac-cell__t{padding:2px 0;font:400 16px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9)}
.sheet--add-card .ac-cell__d{padding-bottom:2px;font:400 12px/16px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.5)}
.sheet--add-card .ac-cell__chev{display:flex;align-items:center;flex:none;min-height:64px;padding:8px 0}
.sheet--add-card .ac-cell__chev img{width:24px;height:24px}

/* ================= product ================= */
.sheet--product{display:flex;flex-direction:column;max-height:770px}
.sheet--product .sheet__scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:8px 0 16px}
.sheet--product .pi-car{position:relative;display:flex;gap:24px;height:172px;padding:1px 67.5px 0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.sheet--product .pi-car::-webkit-scrollbar{display:none}
.sheet--product .pi-card{display:grid;flex:none;width:240px;height:151px;border-radius:20px;overflow:hidden;scroll-snap-align:center}
.sheet--product .pi-card>img,.sheet--product .pi-card::after{grid-area:1/1}
.sheet--product .pi-card img[data-skin]{width:240px;height:151px;object-fit:cover}
.sheet--product .pi-card__pay{align-self:start;justify-self:start;width:216px;height:17.585px;margin:12px}
.sheet--product .pi-card::after{content:"";border:1px solid rgba(255,255,255,.15);border-radius:20px}

.sheet--product .pi-tabs{display:flex;justify-content:center;gap:8px;margin-top:16px}
.sheet--product .pi-chip{display:flex;align-items:center;height:32px;padding:4px 16px;border-radius:24px;background:#fff;font:500 14px/20px var(--font);color:rgba(0,0,0,.9);white-space:nowrap}
.sheet--product .pi-chip.is-active{background:#ec3342;color:#fff}
.sheet--product .pi-desc{margin:12px 0 0;padding:0 16px;font:400 16px/20px var(--font);letter-spacing:-.1px;text-align:center;color:rgba(0,0,0,.9)}
.sheet--product .pi-ben-slot{margin-top:8px}

.sheet--product .pi-benefits{display:flex;flex-direction:column;gap:4px}
.sheet--product .pi-ben{display:flex;align-items:flex-start;padding:0 16px}
.sheet--product .pi-ben__ico{flex:none;padding:20px 12px 20px 0}
.sheet--product .pi-ben__ico img{width:24px;height:24px}
.sheet--product .pi-ben__txt{display:flex;flex:1;flex-direction:column;justify-content:center;gap:1px;min-width:0;min-height:64px;padding:9px 0 10px}
.sheet--product .pi-ben__t{display:flex;align-items:center;min-height:24px;font:400 16px/20px var(--font);color:rgba(0,0,0,.9)}
.sheet--product .pi-ben__d{min-height:18px;font:400 12px/16px var(--font);color:rgba(0,0,0,.5)}
.sheet--product .pi-ben--single .pi-ben__txt{gap:0;padding:8px 0}
.sheet--product .pi-ben--single .pi-ben__t{padding:2px 0}
.sheet--product .pi-ben__link{display:block;padding:0 52px;font:500 14px/20px var(--font);color:#269add;white-space:nowrap;cursor:pointer}

.sheet--product .pi-ref{margin-top:9px;padding:0 16px}
.sheet--product .pi-ref__row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 16px;border-radius:10px;background:rgba(0,0,0,.05);text-align:left;cursor:pointer}
.sheet--product .pi-ref__lbl{flex:1;padding:12px 0;font:400 16px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9)}
/* Switch (BirDS): default<->pressed 150 ms, pressed->selected 150 ms; while pressed the thumb
   stretches by 4px towards the centre and a selected track takes the brand-pressed token */
.sheet--product .pi-sw{position:relative;flex:none;width:38px;height:24px;margin-left:12px;border-radius:12px;background:#cacacf;transition:background-color .15s ease-out}
.sheet--product .pi-sw::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .15s ease-out,width .15s ease-out}
.sheet--product.is-referral .pi-sw{background:#ec3342}
.sheet--product.is-referral .pi-sw::after{transform:translateX(14px)}
.sheet--product .pi-ref__row:active .pi-sw::after{width:24px}
.sheet--product.is-referral .pi-ref__row:active .pi-sw{background:#a81d29}
.sheet--product.is-referral .pi-ref__row:active .pi-sw::after{transform:translateX(10px)}
.sheet--product .pi-ref__more{display:none}
.sheet--product.is-referral .pi-ref__more{display:block}
.sheet--product .pi-ref__note{margin:12px 0 0;font:400 14px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9)}
/* Box Input (iOS, Text): Normal = no stroke, Active (focused) = 1px rgba(0,0,0,.2), Active Error = 1px #f8c6c3;
   field 343x64, inside stroke, content inset 12px */
.sheet--product .pi-field{display:flex;flex-direction:column;justify-content:center;height:64px;margin-top:16px;padding:0 11px;border:1px solid transparent;border-radius:10px;background:#f1f1f4;cursor:text;transition:border-color .15s}
.sheet--product .pi-field:focus-within{border-color:rgba(0,0,0,.2)}
.sheet--product .pi-field__lbl{font:400 12px/16px var(--font);color:rgba(0,0,0,.5)}
.sheet--product .pi-field input{display:block;width:100%;height:20px;margin-top:4px;padding:0;border:0;outline:0;background:transparent;font:400 16px/20px var(--font);color:rgba(0,0,0,.9);caret-color:rgba(0,0,0,.9)}
.sheet--product .pi-ref__err{display:none;align-items:flex-start;gap:4px;margin-top:4px;font:400 12px/16px var(--font);color:#dd3826}
.sheet--product .pi-ref__err::before{content:"";flex:none;width:16px;height:16px;background:url(assets/order1/ic-error-16.svg) center/16px 16px no-repeat}
.sheet--product.is-ref-error .pi-ref__err{display:flex}
.sheet--product.is-ref-error .pi-field{border-color:#f8c6c3}

.sheet--product .pi-foot{flex:none;padding:16px 16px 40px;background:#f1f1f4}
.sheet--product .pi-cta{display:flex;align-items:center;justify-content:center;width:100%;height:56px;padding:0 24px;border-radius:10px;background:#ec3342;font:600 16px/20px var(--font);color:#fff;text-align:center;cursor:pointer}

/* ================= currency ================= */
.sheet--currency .cu-row{display:flex;align-items:flex-start;width:375px;padding:0 16px;text-align:left;cursor:pointer}
.sheet--currency .cu-ico{display:flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;margin:10px 12px 10px 0;border-radius:12px;background:#fff}

/* ================= pages: shared nav ================= */

.scr--loading .ld-txt__h{font:500 20px/24px var(--font);color:rgba(0,0,0,.9)}

.scr--phone .ph-row{position:relative;display:flex;align-items:center;justify-content:center;gap:2px;width:335px;height:48px}
.scr--phone .ph-num{font:500 20px/24px var(--font);color:rgba(0,0,0,.5);white-space:nowrap}

.scr--phone .ph-foot{position:absolute;left:0;top:716px;width:375px;padding:0 16px}
.scr--phone .o1-btn{display:flex;align-items:center;justify-content:center;width:343px;height:56px;padding:0 24px;border-radius:10px;background:#ec3342;font:500 16px/24px var(--font);color:#fff;text-align:center;cursor:pointer}

/* ================= BirDS interaction states =================
   Press feedback (BirDS "Animation and interaction"): press-token fill, content 0.95, 100 ms,
   outer size / touch area unchanged. These screens use the legacy library (Button
   cd13c477…/d7d8ac0f…, Box Input, Passcode input), so its tokens are kept: brand #ec3342,
   brand-pressed #a81d29, disabled = 50 % opacity. */
/* Button Primary (40 / L-56): Pressed + Disabled */
:is(.sheet--add-card .ac-main__btn,.sheet--product .pi-cta,.sheet--currency .cu-btn,:is(.scr--phone,.scr--pin) .o1-btn,.scr--info .in-btn):active{background:#a81d29;transition:background-color .1s ease-out}
:is(.sheet--add-card .ac-main__btn,.sheet--product .pi-cta,.sheet--currency .cu-btn,:is(.scr--phone,.scr--pin) .o1-btn,.scr--info .in-btn):disabled{opacity:.5;pointer-events:none;cursor:default}
.sheet--product .pi-cta>span{display:inline-block;transition:transform .1s ease-out}
.sheet--product .pi-cta:active>span{transform:scale(.95)}
/* Sheet Title close (Button Icon / Circular, Secondary on surface): pressed fill + icon 0.95 */
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st__x img,.scr--info .in-back img{transition:transform .1s ease-out}
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st__x:active,.scr--info .in-back:active{background:#e9e7e7;transition:background-color .1s ease-out}
:is(.sheet--add-card,.sheet--product,.sheet--currency) .o1-st__x:active img,.scr--info .in-back:active img{transform:scale(.95)}
/* Chips (tabs "For daily / travel / Premium"): pressed fill 150 ms in, selection instant */
.sheet--add-card .ac-tab:active{background:#e9e7e7;transition:background-color .15s ease-out}
/* Chips (Card) — product chips: pressed fill + content 0.95 */
.sheet--add-card .ac-chip>span{transition:transform .1s ease-out}
.sheet--add-card .ac-chip:active{background:#e9e7e7;transition:background-color .1s ease-out}
.sheet--add-card .ac-chip:active>span{transform:scale(.95)}
/* Main product (hero card) */
.sheet--add-card .ac-hero__img{transition:transform .1s ease-out}
.sheet--add-card .ac-hero:active .ac-hero__img{transform:scale(.95)}
/* Cell (Info / Info Cell / Document list cell), Container=False: rounded press layer extended
   8px past the content, content 0.95 */
:is(.sheet--add-card .ac-cell,.sheet--currency .cu-row,.scr--info .in-cell){position:relative}
:is(.sheet--add-card .ac-cell,.sheet--currency .cu-row,.scr--info .in-cell)::before{content:"";position:absolute;top:0;bottom:0;left:8px;right:8px;border-radius:12px;background:#e9e7e7;opacity:0;transition:opacity .1s ease-out;pointer-events:none}
:is(.sheet--add-card .ac-cell,.sheet--currency .cu-row,.scr--info .in-cell)>*{position:relative;transition:transform .1s ease-out}
:is(.sheet--add-card .ac-cell,.sheet--currency .cu-row,.scr--info .in-cell):active::before{opacity:1}
:is(.sheet--add-card .ac-cell,.sheet--currency .cu-row,.scr--info .in-cell):active>*{transform:scale(.95)}
/* Basic cell with Switcher (referral row, Container=True): content 0.95 while pressed */
.sheet--product .pi-ref__row>*{transition:transform .1s ease-out}
.sheet--product .pi-ref__row:active>*{transform:scale(.95)}
</style>
