<!-- Delivery methods: address delivery, branch pickup, date/time, courier info, additional offers -->
<style>
/* ===== delivery group: shared fragments (dl-*) ===== */
.dl-abs{position:absolute}
.dl-map{position:absolute;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.dl-img{position:absolute;max-width:none;pointer-events:none}
.dl-btn{cursor:pointer}

/* new header (circle back, 2-line title, segmented chips) */
.dl-hd{position:absolute;left:0;top:0;width:375px;z-index:5;background:#f1f1f4;border-bottom:.5px solid rgba(0,0,0,.1);padding-bottom:12px;display:flex;flex-direction:column;gap:12px}
.dl-hd__nav{padding-top:44px;display:flex;flex-direction:column;gap:4px}
.dl-hd__bar{height:56px;padding:0 16px;display:flex;align-items:center}
.dl-back{width:40px;height:40px;border-radius:256px;background:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dl-back img{width:24px;height:24px}
.dl-title{padding:0 16px;font:700 28px/32px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9);margin:0;text-wrap:balance}
.dl-tabs{padding:0 16px;display:flex;gap:8px}
.dl-chip{height:40px;padding:0 16px;border-radius:256px;background:#fff;color:#25282b;font:500 14px/20px var(--font);white-space:nowrap;display:flex;align-items:center;cursor:pointer;flex:none}
.dl-chip.is-on{background:#ec3342;color:#fff}

/* old header (plain chevron) */
.dl-ohd{position:absolute;left:0;top:0;width:375px;z-index:5;background:#f1f1f4}
.dl-ohd--tabs{border-bottom:.5px solid rgba(0,0,0,.1);padding-bottom:12px}
.dl-ohd__bar{margin-top:44px;height:52px;position:relative}
.dl-oback{position:absolute;left:8px;top:2px;width:40px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dl-oback img{width:24px;height:24px}
.dl-ohd .dl-title{padding-top:2px}
.dl-ohd--tabs .dl-title{padding-bottom:4px;margin-bottom:12px}

/* bottom panel over the map */
.dl-panel{position:absolute;left:0;bottom:0;width:375px;background:#fff;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;z-index:2}
.dl-grab{width:375px;height:16px;margin-bottom:8px;flex:none}

/* pill search (new) */
.dl-search{width:343px;display:flex;align-items:center;gap:8px;flex:none;cursor:pointer}
.dl-search__field{flex:1;min-width:0;height:40px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f1f1f4;border:.5px solid rgba(0,0,0,.1);border-radius:256px}
.dl-search__field>img{width:24px;height:24px;flex:none}
.dl-search__ph{flex:1;font:400 16px/24px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.5)}
.dl-search__input{flex:1;min-width:0;height:24px;border:0;outline:0;background:transparent;padding:0;margin:0;font:400 16px/24px var(--font);letter-spacing:-.1px;color:#212426;caret-color:#212426}
.dl-search__input::placeholder{color:rgba(0,0,0,.5)}
.dl-search__clear{width:24px;height:24px;flex:none}
/* Input (Search): clear button only while the field has a value; Focus+Fill uses the 10 px field */
.dl-search__input:placeholder-shown~.dl-search__clear{visibility:hidden}
.dl-search--focus .dl-search__field:has(.dl-search__input:not(:placeholder-shown)){border-radius:10px}
.dl-search--typed .dl-search__field:has(.dl-search__input:placeholder-shown){border-radius:256px}
.dl-search__cancel{height:40px;display:flex;align-items:center;font:500 16px/20px var(--font);letter-spacing:-.1px;color:#ec3342;flex:none;cursor:pointer}
.dl-search--focus .dl-search__field{border:1px solid rgba(0,0,0,.2)}
.dl-search--typed .dl-search__field{border:1px solid rgba(0,0,0,.2);border-radius:10px}

/* small search (old, 32px) */
.dl-osearch{width:343px;height:32px;display:flex;align-items:center;flex:none;cursor:pointer}
.dl-osearch__field{flex:1;min-width:0;height:32px;display:flex;align-items:center;padding:0 8px;background:#f1f1f4;border-radius:10px}
.dl-osearch__field>img{width:16px;height:16px;margin-right:8px;flex:none}
.dl-osearch__ph{font:400 16px/20px var(--font);color:rgba(0,0,0,.5)}
.dl-osearch__input{flex:1;min-width:0;height:20px;border:0;outline:0;background:transparent;padding:0;margin:0 8px 0 0;font:400 16px/20px var(--font);color:#25282b;caret-color:#25282b}
.dl-osearch__input::placeholder{color:rgba(0,0,0,.5)}
.dl-osearch__clear{width:16px;height:16px;flex:none}
.dl-osearch__input:placeholder-shown~.dl-osearch__clear{visibility:hidden}
.dl-osearch__cancel{height:32px;padding-left:8px;display:flex;align-items:center;font:400 16px/20px var(--font);color:#d50819;flex:none;cursor:pointer}
.dl-osearch--focus .dl-osearch__field{background:#f3f3f5;border:1px solid #82848a}
.dl-osearch__text{font:400 16px/20px var(--font);color:#25282b;white-space:nowrap}
.dl-caret{display:inline-block;width:2px;height:18px;border-radius:1px;background:#25282b;vertical-align:-3px}

/* address cell */
.dl-cell{width:375px;display:flex;align-items:center;gap:12px;padding:0 16px;min-height:64px;cursor:pointer;text-align:left;flex:none}
.dl-cell__ic{width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;flex:none}
.dl-cell__ic img{width:26px;height:26px}
.dl-cell__ic--w{background:#fff}
.dl-cell__txt{flex:1;min-width:0;padding:8px 0;display:flex;flex-direction:column;justify-content:center;min-height:64px}
.dl-cell__t{padding:2px 0;font:400 16px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-cell__d{padding-bottom:2px;font:400 12px/16px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-cell__chev{width:24px;height:24px;flex:none}
.dl-cell__link{font:400 16px/20px var(--font);letter-spacing:-.1px;color:#269add;white-space:nowrap;padding:2px 0;cursor:pointer}

/* branch row */
.dl-brow{width:375px;display:flex;padding:0 16px;text-align:left;cursor:pointer;flex:none}
.dl-brow__ic{padding:10px 12px 10px 0;flex:none}
.dl-brow__ic span{width:44px;height:44px;border-radius:12px;background:#f1f1f4;display:flex;align-items:center;justify-content:center}
.dl-brow__ic img{width:24px;height:24px}
.dl-brow__main{flex:1;min-width:0;display:flex;flex-direction:column}
.dl-brow__sep .dl-brow__main{border-bottom:1px solid rgba(0,0,0,.1)}
.dl-brow__blk{display:flex}
.dl-brow__txt{flex:1;min-width:0;min-height:64px;padding-bottom:1px;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden}
.dl-brow__n{font:400 16px/24px var(--font);color:rgba(0,0,0,.9)}
.dl-brow__d{min-height:18px;font:400 12px/16px var(--font);color:rgba(0,0,0,.5);white-space:nowrap}
.dl-brow__r{width:182px;padding:9px 0 10px 12px;min-height:64px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;flex:none}
.dl-brow__km{padding-top:2px;margin-bottom:-1px;font:500 14px/20px var(--font);color:rgba(0,0,0,.9);text-align:right}
.dl-brow__st{padding:2px 0;font:500 14px/20px var(--font);color:#20b649;text-align:right}
.dl-brow__st--off{color:rgba(0,0,0,.5)}

/* map controls */
.dl-mapctl{position:absolute;left:315px;display:flex;flex-direction:column;gap:8px;z-index:1}
.dl-mapbtn{width:44px;height:44px;padding:10px;border-radius:12px;background:#fff;filter:drop-shadow(0 4px 10px rgba(0,0,0,.1))}
.dl-mapbtn img{width:24px;height:24px}
.dl-mapnav{width:44px;height:44px;position:relative}
.dl-mapnav img{position:absolute;left:-20px;top:-16px;width:84px;height:84px;max-width:none}

/* buttons */
.dl-primary{width:343px;height:56px;border-radius:10px;background:#ec3342;color:#fff;font:500 16px/24px var(--font);text-align:center;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.dl-primary--l1m{font:500 16px/20px var(--font);letter-spacing:-.1px}
.dl-ghost{width:343px;height:56px;border-radius:10px;color:#ec3342;font:500 16px/24px var(--font);text-align:center;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}

/* BirDS press feedback (Button / Button (Icon) / Cell 100 ms, Chips 150 ms — "Animation and interaction"):
   the background takes the press token while the content scales to .95; the background layer (::before)
   counter-scales so it keeps the original bounds and the touch area does not change. */
.dl-primary,.dl-ghost,.dl-back,.dl-chip,button.dl-search__cancel,button.dl-osearch__cancel,button.dl-cell,button.dl-brow,.dl-time{position:relative}
.dl-primary,.dl-ghost,.dl-back,.dl-oback,.dl-chip,button.dl-search__cancel,button.dl-osearch__cancel,button.dl-cell,button.dl-brow,.dl-time{
  isolation:isolate;transition:transform .1s ease-out}
.dl-primary::before,.dl-ghost::before,.dl-back::before,.dl-oback::before,.dl-chip::before,button.dl-search__cancel::before,button.dl-osearch__cancel::before,
button.dl-cell::before,button.dl-brow::before,.dl-time::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  transition:transform .1s ease-out,background-color .1s ease-out}
.dl-primary:active,.dl-ghost:active,.dl-back:active,.dl-oback:active,.dl-chip:active,button.dl-search__cancel:active,button.dl-osearch__cancel:active,
button.dl-cell:active,button.dl-brow:active,.dl-time:active{transform:scale(.95)}
.dl-primary:active::before,.dl-ghost:active::before,.dl-back:active::before,.dl-oback:active::before,.dl-chip:active::before,
button.dl-search__cancel:active::before,button.dl-osearch__cancel:active::before,button.dl-cell:active::before,button.dl-brow:active::before,
.dl-time:active::before{transform:scale(1.0526);background:#e9e7e7}                 /* UI_Element_Base_pressed */
.dl-primary:active::before{background:#d12432}                                        /* UI_Element_Brand_pressed */
.dl-oback::before{inset:4px 0;border-radius:256px}
button.dl-search__cancel::before,button.dl-osearch__cancel::before{inset:0 -8px;border-radius:10px}
button.dl-cell::before,button.dl-brow::before,.dl-time::before{left:16px;right:16px;border-radius:12px}
/* Chips: default → pressed 150 ms, pressed → active instant */
.dl-chip,.dl-chip::before{transition-duration:.15s}
.dl-chip:not(.is-on):not(.is-selected):active::before{background:#e5e6e9}            /* Chips State=Hover/Pressed */
.dl-chip.is-on:active::before,.dl-chip.is-selected:active::before{background:#d12432}

/* bottom button group with grey fade (Bottom button group) */
.dl-bbg{position:absolute;left:0;bottom:0;width:375px;padding-top:12px;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:3}
.dl-bbg::before{content:"";position:absolute;left:0;right:0;top:-28px;bottom:-4px;z-index:-1;
  background:linear-gradient(0deg,#f5f5f7 50%,rgba(245,245,247,.991) 53.3%,rgba(245,245,247,.964) 56.6%,rgba(245,245,247,.918) 59.9%,rgba(245,245,247,.853) 63.2%,rgba(245,245,247,.768) 66.5%,rgba(245,245,247,.668) 69.8%,rgba(245,245,247,.557) 73.1%,rgba(245,245,247,.443) 76.4%,rgba(245,245,247,.332) 79.7%,rgba(245,245,247,.232) 83%,rgba(245,245,247,.147) 86.3%,rgba(245,245,247,.082) 89.6%,rgba(245,245,247,.036) 92.9%,rgba(245,245,247,.009) 96.2%,rgba(245,245,247,0) 99.5%)}
.dl-bbg__home{height:32px;width:375px}

/* fader (dim layer drawn inside page states) */
.dl-fader{position:absolute;inset:0;background:rgba(31,33,34,.8);z-index:10}

/* iOS QWERTY keyboard (static) */
.dl-kb{position:absolute;left:0;bottom:0;width:375px;height:293px;background:#d4d6db;z-index:20;font-family:"SF Pro Text",var(--font);color:#25282b;user-select:none;-webkit-user-select:none}
.dl-kb__k{position:absolute;height:43px;border-radius:5px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-weight:300;font-size:24px;line-height:29px;}
.dl-kb--lower .dl-kb__k{padding-bottom:3px}
.dl-kb__k--g{background:#a5a7ad}
.dl-kb__k--lbl{font-weight:400;font-size:16px;line-height:19px;letter-spacing:-.32px;padding-bottom:0!important}
.dl-kb__k img{width:32px;height:32px}
.dl-kb .dl-kb__shoff{width:19px;height:16.3px}
.dl-kb__ic{position:absolute;top:233px;width:42px;height:42px}

/* switch (offers) — Toggle-Switch Item iOS M-24: Active = brand track, thumb 20 px at x 16; Inactive = #f3f3f5 track,
   thumb at x 2. BirDS Switch: the thumb slides in 150 ms; pressed → track takes the press token, thumb stretches 4 px.
   The track is drawn by .dl-switch, the thumb by .dl-switch__off (class names kept for the ins1-off / ins2-off toggles). */
.dl-switch{position:relative;display:block;width:38px;height:24px;flex:none;border-radius:12px;background:#ec3342;cursor:pointer;transition:background-color .15s}
.dl-switch__off{position:absolute;left:16px;top:2px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .15s ease-out,width .15s ease-out,box-shadow .15s}
.dl-switch:active{background:#d12432}
.dl-switch:active .dl-switch__off{left:12px;width:24px}

/* ===== delivery (address) ===== */
.scr--delivery{background:#f1f1f4}
.scr--delivery .dl-panel__time{width:343px;margin:12px 0 8px;font:600 14px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9);flex:none}
.scr--delivery .dl-zero{padding:12px 16px calc(12px + 32.692px);width:375px;display:flex;flex-direction:column;align-items:center;gap:24px}
.scr--delivery .dl-zero__top{display:flex;flex-direction:column;align-items:center;gap:16px;width:343px}
.scr--delivery .dl-zero__ic{width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.scr--delivery .dl-zero__ic img{width:40px;height:40px}
.scr--delivery .dl-zero__txt{margin:0;font:600 16px/20px var(--font);letter-spacing:-.1px;text-align:center;color:rgba(0,0,0,.9)}
.scr--delivery .dl-zero__btns{display:flex;flex-direction:column;gap:8px}
.scr--delivery .dl-empty{margin-top:72px;font:400 14px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.5);white-space:nowrap}
.scr--delivery .dl-empty--g{color:#80858a}
/* iOS alert */
.scr--delivery .dl-alert{position:absolute;left:53px;top:50%;transform:translateY(-50%);width:270px;border-radius:15px;overflow:hidden;background:rgba(249,249,249,.78);-webkit-backdrop-filter:blur(68px);backdrop-filter:blur(68px);z-index:11}
.scr--delivery .dl-alert__body{padding:19px 16px 17px;border-bottom:.5px solid rgba(0,0,0,.3);display:flex;flex-direction:column;gap:2px;text-align:center}
.scr--delivery .dl-alert__t{margin:0;font:500 16px/24px var(--font);color:#25282b}
.scr--delivery .dl-alert__m{margin:0;font:400 13px/18px "SF Pro Text",var(--font);letter-spacing:-.078px;color:rgba(0,0,0,.5)}
.scr--delivery .dl-alert__row{display:flex}
.scr--delivery .dl-alert__b{flex:1;padding:11px 16px;font:400 17px/22px "SF Pro Text",var(--font);letter-spacing:-.408px;color:#007aff;text-align:center;cursor:pointer}
.scr--delivery .dl-alert__b--bold{font-weight:600}
.scr--delivery .dl-alert__sep{width:.5px;background:rgba(0,0,0,.3)}
/* unavailable sheet */
.scr--delivery .dl-sheet{position:absolute;left:0;bottom:0;width:375px;background:#fff;border-radius:16px 16px 0 0;z-index:11;display:flex;flex-direction:column;gap:32px}
.scr--delivery .dl-sheet__head{padding-bottom:16px;display:flex;flex-direction:column}
.scr--delivery .dl-sheet__head .dl-grab{margin-bottom:8px}
.scr--delivery .dl-sheet__t{margin:0;padding:0 16px;font:700 28px/32px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9)}
.scr--delivery .dl-sheet__m{margin:0;padding:0 16px;font:400 16px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9)}
.scr--delivery .dl-sheet__btns{padding:0 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:40px}

/* ===== delivery-search ===== */
.scr--delivery-search{background:#f1f1f4}
.scr--delivery-search .dl-panel{gap:0}
.scr--delivery-search .dl-list{margin-top:16px;display:flex;flex-direction:column}
.scr--delivery-search .dl-empty{margin-top:72px;font:400 14px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.5);white-space:nowrap}

/* ===== delivery-confirm ===== */
.scr--delivery-confirm{background:#f1f1f4}
.scr--delivery-confirm .dl-cell{margin-top:16px}
.scr--delivery-confirm .dl-panel{height:300px}

/* ===== delivery-map ===== */
.scr--delivery-map{background:#f1f1f4}
.scr--delivery-map .dl-panel{height:167px;overflow:hidden}
.scr--delivery-map .dl-list{margin-top:8px;display:flex;flex-direction:column}

/* ===== delivery-date ===== */
.scr--delivery-date{background:#f1f1f4}
.scr--delivery-date .dl-hd{border-bottom:0;padding-bottom:0}
.scr--delivery-date .dl-bbg{gap:12px}
.scr--delivery-date .dl-dates{position:absolute;left:0;top:188px;width:375px;display:flex;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.scr--delivery-date .dl-dates::-webkit-scrollbar{display:none}
.scr--delivery-date .dl-dates::after{content:"";flex:none;width:8px}
.scr--delivery-date .dl-dates .dl-chip.is-selected{background:#ec3342;color:#fff}
.scr--delivery-date .dl-times{position:absolute;left:0;top:244px;width:375px;display:flex;flex-direction:column}
.scr--delivery-date .dl-time{width:375px;height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:left}
.scr--delivery-date .dl-time__t{padding:2px 0;font:400 16px/20px var(--font);color:rgba(0,0,0,.9)}
.scr--delivery-date .dl-time__r{width:24px;height:24px;margin-left:12px;position:relative;flex:none}
.scr--delivery-date .dl-time__r img{position:absolute;inset:0;width:24px;height:24px}

.scr--delivery-date .dl-time.is-selected .dl-r-on{display:block}
.scr--delivery-date .dl-time.is-selected .dl-r-off{display:none}

/* ===== delivery-courier ===== */
.scr--delivery-courier{background:#f1f1f4}
.scr--delivery-courier .dl-hd{border-bottom:0;padding-bottom:0}
.scr--delivery-courier .dl-form{position:absolute;left:16px;top:156px;width:343px;display:flex;flex-direction:column;gap:16px}
.scr--delivery-courier .dl-info{height:48px;padding:0 16px;border:1px solid #c3e5f8;border-radius:10px;display:flex;align-items:center;gap:12px}
.scr--delivery-courier .dl-info__logo{width:24px;height:24px;border-radius:6px;background:#00c2e8;position:relative;overflow:hidden;flex:none}
.scr--delivery-courier .dl-info__logo img{position:absolute;left:4px;top:4px;width:16px;height:16px}
.scr--delivery-courier .dl-info__t{font:400 16px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9);white-space:nowrap}
.scr--delivery-courier .dl-fields{display:flex;flex-direction:column;gap:8px}
.scr--delivery-courier .dl-field{position:relative;display:block;height:56px;background:#fff;border:.5px solid rgba(0,0,0,.1);border-radius:10px;cursor:text}
.scr--delivery-courier .dl-field:focus-within{border:1px solid rgba(0,0,0,.2)}
.scr--delivery-courier .dl-field__label{position:absolute;left:12px;right:12px;top:18px;font:400 16px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.scr--delivery-courier .dl-field__input{position:absolute;left:12px;right:12px;top:26px;height:20px;padding:0;margin:0;border:0;outline:0;background:transparent;font:400 16px/20px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9);caret-color:#212426}
.scr--delivery-courier .dl-field__input::placeholder{color:transparent}
.scr--delivery-courier .dl-field__input:focus::placeholder{color:rgba(0,0,0,.35)}
.scr--delivery-courier .dl-field:focus-within .dl-field__label,
.scr--delivery-courier .dl-field__input:not(:placeholder-shown)+.dl-field__label{top:8px;font-size:12px;line-height:16px}
.scr--delivery-courier .dl-field__input:not(:focus):placeholder-shown{opacity:0}
.scr--delivery-courier .dl-cta{position:absolute;left:16px;bottom:44px;z-index:3}
.scr--delivery-courier .dl-kb{display:none}
.scr--delivery-courier:focus-within .dl-kb{display:block}
.scr--delivery-courier:focus-within .dl-cta{bottom:305px}

/* ===== branch / branch-search / branch-confirm ===== */
.scr--branch,.scr--branch-search,.scr--branch-confirm{background:#f1f1f4}
.scr--branch .dl-panel{top:470px}
.scr--branch .dl-list,.scr--branch-search .dl-list{margin-top:12px;display:flex;flex-direction:column}
.scr--branch-search .dl-panel{top:253px}
.scr--branch-confirm .dl-panel{height:344.692px}
