/* =====================================================================
   errors group: error pages, third-card, same-currency, back-alert,

   ===================================================================== */

/* ---------- shared fragments (prefix .erx-) ---------- */
.erx-btn{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:56px;padding:0 24px;border-radius:10px;
  font:500 16px/24px var(--font);text-align:center;color:#ec3342;background:transparent;cursor:pointer}
.erx-btn--primary{background:#ec3342;color:#fff}
/* BirDS press feedback (Button / Button (Icon) "Animation and interaction"): background takes the press token,
   content scales to .95 in 100 ms; the background layer (::before) counter-scales and keeps the full bounds.
   Primary → UI_Element_Brand_pressed, Ghost/text and icon buttons → UI_Element_Base_pressed. */
.erx-btn,.erx-back,.scr--same-currency .sc__back,.sheet--what-pin .wp__close,.sheet--what-pin button.wp__chip{isolation:isolate;transition:transform .1s ease-out}
.erx-btn::before,.erx-back::before,.scr--same-currency .sc__back::before,.sheet--what-pin .wp__close::before,.sheet--what-pin button.wp__chip::before{
  content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;transition:transform .1s ease-out,background-color .1s ease-out}
.erx-btn:active,.erx-back:active,.scr--same-currency .sc__back:active,.sheet--what-pin .wp__close:active,.sheet--what-pin button.wp__chip:active{transform:scale(.95)}
.erx-btn:active::before,.erx-back:active::before,.scr--same-currency .sc__back:active::before,.sheet--what-pin .wp__close:active::before{
  background:#e9e7e7;transform:scale(1.0526)}
.erx-btn--primary:active::before{background:#d12432}
.erx-back::before{inset:4px 0;border-radius:256px}
.erx-back{position:absolute;left:8px;top:46px;z-index:2;width:40px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.erx-back img{width:24px;height:24px}

.erx-kb__row{position:absolute;height:43px;display:flex;gap:6px}

  font:300 24px/normal "SF Pro Text",var(--font);text-align:center;text-transform:lowercase}
.erx-kb__k span,.erx-kb__lbl span{position:absolute;left:0;right:0}

.erx-kb__lbl{position:absolute;top:3px;height:43px;border-radius:5px;box-shadow:0 1px 0 rgba(0,0,0,.3);
  font:400 16px/normal "SF Pro Text",var(--font);letter-spacing:-.32px;text-align:center}
.erx-kb__lbl span{top:calc(50% - 9.5px)}
.erx-kb__123{left:3px;width:87px;background:#a5a7ad}
.erx-kb__space{left:96px;right:97px;background:#fff}
.erx-kb__ret{right:3px;width:87px;background:#a5a7ad}

  rgba(255,255,255,.853) 74.627%,rgba(255,255,255,.768) 76.974%,rgba(255,255,255,.668) 79.321%,rgba(255,255,255,.557) 81.668%,
  rgba(255,255,255,.443) 84.014%,rgba(255,255,255,.332) 86.361%,rgba(255,255,255,.232) 88.708%,rgba(255,255,255,.147) 91.054%,
  rgba(255,255,255,.082) 93.401%,rgba(255,255,255,.036) 95.748%,rgba(255,255,255,.009) 98.095%,rgba(255,255,255,0) 100.44%)}
.scr--err .err__btns{position:relative;display:flex;flex-direction:column;gap:8px;padding:0 16px}

.scr--fin .fin__title{position:absolute;left:16px;top:98px;width:343px;margin:0;font:700 28px/32px var(--font);letter-spacing:-.1px;color:rgba(0,0,0,.9)}

.scr--fin .fin__content{flex:1 1 0;min-width:0;height:64px;padding-right:4px;display:flex;flex-direction:column;justify-content:center;cursor:text}
.scr--fin .fin__label{font:400 12px/16px var(--font);color:rgba(0,0,0,.5);white-space:nowrap}
.scr--fin .fin__input{display:block;width:100%;height:20px;margin:4px 0 0;padding:0;border:0;outline:0;background:transparent;border-radius:0;
  font:400 16px/20px var(--font);color:rgba(0,0,0,.9);caret-color:rgba(0,0,0,.9);-webkit-appearance:none;appearance:none}

.scr--fin .fin__info img{width:24px;height:24px}
.scr--fin .fin__err{display:flex;gap:4px;align-items:flex-start}

.scr--fin .fin__err span{font:400 12px/16px var(--font);color:#dd3826;white-space:nowrap}
/* bottom block = button + keyboard; keyboard shows only while an input is focused.
   Hiding is delayed so a tap on "Continue" (which blurs the input) still lands on the button. */
.scr--fin .fin__bottom{position:absolute;left:0;bottom:0;width:375px;display:flex;flex-direction:column;gap:12px;
  transform:translateY(265px);transition:transform .25s ease .2s}
.scr--fin .fin__btns{padding:0 16px}
/* Figma (fin, fin__error): Button State=Inactive while the FİN field is empty → Disabled look (50 %), not pressable */

.scr--fin .fin__bottom .erx-kb{visibility:hidden;transition:visibility 0s .45s}
.scr--fin:has(.fin__input:focus) .fin__bottom{transform:none;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.scr--fin:has(.fin__input:focus) .erx-kb{visibility:visible;transition:none}

/* Chips (radio, "only one element can be selected"): both chips switch the tab, the selected one is not pressable;

.sheet--what-pin button.wp__chip,.sheet--what-pin button.wp__chip::before{transition-duration:.15s}
.sheet--what-pin:not(.is-nonres) .wp__chip--res,.sheet--what-pin.is-nonres .wp__chip--nonres{pointer-events:none}
.sheet--what-pin button.wp__chip:active::before{background:#e5e6e9;transform:scale(1.0526)}
