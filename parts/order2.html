/* BirDS press feedback (Button (Regular) / Button (Icon), "Animation and interaction"): on press the background
   takes the press token and the content scales to .95 in 100 ms while the background layer keeps the full bounds.
   ::before is that background layer; it counter-scales (1/.95) so only the content shrinks. */
.o2-btn,button.o2-iconbtn{isolation:isolate;transition:transform .1s ease-out}
.o2-btn{position:relative}
.o2-btn::before,button.o2-iconbtn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  transition:transform .1s ease-out,background-color .1s ease-out}
button.o2-iconbtn::before{border-radius:256px}
.o2-btn:active,button.o2-iconbtn:active{transform:scale(.95)}
.o2-btn:active::before{background:#d12432;transform:scale(1.0526)}           /* UI_Element_Brand_pressed */
.o2-btn--ghost:active::before,button.o2-iconbtn:active::before{background:#e9e7e7;transform:scale(1.0526)} /* UI_Element_Base_pressed */
/* Loader (4 stages, Smart animate 300 ms ease-out each, clockwise ~100° per stage) */
.o2-spin{position:relative;width:24px;height:24px;animation:o2spin 1.2s ease-out infinite}
.o2-spin img{position:absolute}
.o2-spin .o2-spin__ring{inset:0;width:24px;height:24px}
.o2-spin .o2-spin__head{top:0;left:50%;width:3.372px;height:3.372px;transform:translateX(-50%) scaleX(-1)}
@keyframes o2spin{0%{transform:rotate(0)}25%{transform:rotate(100deg)}50%{transform:rotate(195deg)}75%{transform:rotate(300deg)}100%{transform:rotate(360deg)}}
