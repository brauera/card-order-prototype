/* ===================== BirDS interaction states =====================
   BirDS "Animation and interaction": on press the background takes the press token
   (UI_Element_Base_pressed #e9e7e7) and the content scales to 0.95 without changing the
   outer layout / touch area; press animation 100 ms (chips 150 ms, release instant). */
/* scale-as-a-whole: Tab (53.2/56), Story (pressed 0.95), Button (Info Action) in the product
   carousel, Item snippet (content 0.95, no fill change), Story feed / banners, onboarding tiles,
   Button (Circular) */
:is(.scr--home,.scr--home-alt) :is(.hm-tab__t,.hm-story,.hm-pi,.hm-snip,.hm-sban,.hm-pban,.hm-aban,.hm-hban__in,.ha-tile,.ha-nosee,.ha-cban__in,.hm-fav,.ha-cban__x){transition:transform .1s ease-out}
:is(.scr--home,.scr--home-alt) :is(.hm-tab__t,.hm-story,.hm-pi,.hm-sban,.hm-pban,.hm-aban,.hm-hban__in,.ha-tile,.ha-nosee,.hm-fav,.ha-cban__x):active,
:is(.scr--home,.scr--home-alt) .hm-snip:active:not(:has(.hm-fav:active)),
:is(.scr--home,.scr--home-alt) .ha-cban__in:active:not(:has(.ha-cban__x:active)){transform:scale(.95)}
:is(.scr--home,.scr--home-alt) :is(.hm-story,.hm-snip,.hm-sban,.hm-pban,.hm-aban,.hm-hban__in,.ha-cban__in){cursor:pointer}
/* Button (Quick action): pressed fill UI_Element_Base_pressed + whole button 0.95 (114/120) */
.scr--home .h-qa button{transition:transform .1s ease-out,background-color .1s ease-out}
.scr--home .h-qa button:active{background:#e9e7e7;transform:scale(.95)}
/* Chips (Radio), unselected: pressed fill UI_Element_Base_pressed, content 0.95, 150 ms in / instant out */
.scr--home .h-chip>*{transition:transform .15s ease-out}
.scr--home .h-chip:active{background:#e9e7e7;transition:background-color .15s ease-out}
.scr--home .h-chip:active>*{transform:scale(.95)}
/* Button (Regular) 48 Secondary: pressed fill UI_Element_Base_pressed */
:is(.scr--home,.scr--home-alt) .hm-more button:active{background:#e9e7e7;transition:background-color .1s ease-out}
/* Cell (Basic/Complex/Product), Container=False: pressed = rounded press-token layer behind
   (extended 8 px past the content), content 0.95 */
.cb-row,.scr--home .h-opt,.scr--home .h-cell{position:relative;cursor:pointer}
.cb-row::before,.scr--home .h-opt::before,.scr--home .h-cell::before{content:"";position:absolute;top:0;bottom:0;left:8px;right:8px;border-radius:12px;background:#e9e7e7;opacity:0;transition:opacity .1s ease-out;pointer-events:none}
.cb-row>*,.scr--home .h-opt>*,.scr--home .h-cell>*{position:relative;transition:transform .1s ease-out}
.cb-row:active::before,.scr--home .h-opt:active::before,.scr--home .h-cell:active::before{opacity:1}
.cb-row:active>*,.scr--home .h-opt:active>*,.scr--home .h-cell:active>*{transform:scale(.95)}
</style>
